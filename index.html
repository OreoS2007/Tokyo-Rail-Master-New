<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>地理マスター</title>
<style>
:root{--paper:#EDEFEA;--plate:#fff;--signage:#16232F;--signage2:#233443;--ink:#1A2530;--muted:#6B7B88;
--rule:#C9CFC8;--yamanote:#9ACD32;--alert:#D0353F;--ok:#4E8A0F;--sea:#132A38;--land:#101A22;
--wardfill:#20343F;--wardline:#3E5C6E;
--g:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
--lat:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--g);line-height:1.6;
-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:780px;margin:0 auto;padding:0 16px 64px}
.topbar{position:sticky;top:0;z-index:40;margin:0 -16px 14px;background:var(--paper)}
.sign{display:flex;align-items:center;gap:12px;background:var(--signage);color:#fff;
padding:12px 16px}
.sign__m{flex:none;width:34px;height:34px;border-radius:50%;background:var(--yamanote);color:#123;
display:grid;place-items:center;font-family:var(--lat);font-weight:700;font-size:12px}
.sign__t{font-size:15px;font-weight:600;letter-spacing:.06em}
.sign__s{font-family:var(--lat);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#8FA3B3;display:block}
.sign__l{margin-left:auto;font-family:var(--mono);font-size:11px;color:#8FA3B3;text-align:right}
.sign__l b{display:block;color:#fff;font-size:13px}
.plate{background:var(--plate);border-radius:5px;overflow:hidden;margin-bottom:18px;
box-shadow:0 1px 0 rgba(22,35,47,.16),0 8px 24px -14px rgba(22,35,47,.5)}
.plate__b{padding:13px 16px 11px;position:relative;min-height:120px;display:flex;flex-direction:column;justify-content:center}
.plate__n{position:absolute;top:11px;left:13px;display:flex;gap:4px;flex-wrap:wrap;max-width:60%}
.plate__n i{font-style:normal;font-family:var(--lat);font-size:8px;font-weight:700;color:#fff;
padding:2px 5px;border-radius:3px;letter-spacing:.04em}
.plate__w{position:absolute;top:12px;right:13px;font-size:10px;color:var(--muted)}
.plate__name{text-align:center;font-size:clamp(24px,7vw,36px);font-weight:600;letter-spacing:.12em;text-indent:.12em;line-height:1.2}
.plate__r{text-align:center;font-family:var(--lat);font-size:9.5px;font-weight:600;letter-spacing:.22em;
text-indent:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.plate__nb{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;font-size:12px;color:var(--muted);gap:8px}
.plate__nb .q{color:var(--alert);font-weight:700}
.plate__bar{height:10px;display:flex}.plate__bar i{flex:1}
.plate--blank .plate__name{color:var(--rule);letter-spacing:.3em}
.q-text{font-size:16px;font-weight:600;margin-bottom:13px}
.card{background:#fff;border:1px solid var(--rule);border-radius:5px;padding:16px;margin-bottom:16px}
.eyebrow{font-family:var(--lat);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.75}
.btn{display:block;width:100%;background:var(--signage);color:#fff;border:none;border-radius:4px;padding:14px 16px;
font-family:var(--g);font-size:15px;font-weight:600;letter-spacing:.06em;cursor:pointer}
.btn:hover{background:var(--signage2)}
.btn--gh{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn--gh:hover{background:#fff}
.btn--sm{padding:10px 14px;font-size:13px;font-weight:500}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);
border-radius:4px;padding:12px 13px;margin-bottom:8px;cursor:pointer;font-family:var(--g);font-size:15px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--signage)}
.opt:disabled{cursor:default}
.opt__k{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid var(--rule);display:grid;
place-items:center;font-family:var(--lat);font-size:11px;color:var(--muted)}
.opt__sub{margin-left:auto;font-size:10px;color:var(--muted);text-align:right;line-height:1.4}
.opt.is-r{border-color:var(--yamanote);background:#F6FBEC;border-width:2px;padding:11px 12px}
.opt.is-r .opt__k{border-color:var(--yamanote);background:var(--yamanote);color:#123}
.opt.is-w{border-color:var(--alert);background:#FDF3F4;border-width:2px;padding:11px 12px}
.opt.is-w .opt__k{border-color:var(--alert);background:var(--alert);color:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;background:#fff;border:1px solid var(--rule);border-radius:4px;padding:10px 8px;
cursor:pointer;font-family:var(--g);font-size:14px;color:var(--ink)}
.seg button small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.seg button[aria-pressed=true]{background:var(--signage);color:#fff;border-color:var(--signage)}
.seg button[aria-pressed=true] small{color:#93A7B6}
.levels{display:grid;gap:8px}
.lvl{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--rule);border-radius:4px;
padding:11px 13px;cursor:pointer;text-align:left;font-family:var(--g);color:var(--ink);width:100%}
.lvl__no{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);border-right:1px solid var(--rule);padding-right:11px}
.lvl__t{font-size:14px;font-weight:600}.lvl__d{font-size:11px;color:var(--muted)}
.lvl__s{margin-left:auto;font-family:var(--lat);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lvl[aria-pressed=true]{border-color:var(--signage);border-width:2px;padding:10px 12px}
.lvl:disabled{opacity:.42;cursor:not-allowed}
.lines-box{max-height:190px;overflow-y:auto;border:1px solid var(--rule);border-radius:4px;padding:8px;background:#fff}
.lchk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 2px;cursor:pointer}
.lchk input{width:15px;height:15px;accent-color:var(--signage);flex:none}
.lchk u{width:11px;height:4px;border-radius:2px;flex:none;text-decoration:none}
.lchk>span:not(.lgo){flex:1;min-width:0}
.lchk em{font-style:normal;font-size:10px;color:var(--muted);flex:none}
.lchk__r{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.lchk__n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-wrap{position:relative;background:var(--land);border-radius:5px;overflow:hidden;
user-select:none;margin:0 auto 10px;touch-action:none}
.map-wrap svg{display:block;width:100%;height:auto;cursor:grab}
.map-wrap.is-drag svg{cursor:grabbing}
.map-tools{position:absolute;right:7px;bottom:7px;display:flex;gap:5px;z-index:4}
.map-tools button{width:30px;height:30px;border-radius:4px;border:1px solid rgba(255,255,255,.22);
background:rgba(6,12,17,.82);color:#fff;font-size:14px;cursor:pointer;display:grid;place-items:center;font-family:var(--lat)}
.map-legend{position:absolute;left:7px;top:7px;z-index:2;background:rgba(6,12,17,.8);border-radius:4px;
padding:6px 8px;font-size:8.5px;color:#9DB2C2;line-height:1.7;max-width:44%}
.map-legend b{color:#fff;font-weight:500}
.map-legend u{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;border:1.4px solid #16232F;
vertical-align:middle;margin:0 1px;text-decoration:none}.map-legend u.s{width:4px;height:4px}
.map-cap{font-size:10.5px;color:var(--muted);text-align:right;margin:-4px 0 14px}
.st-hit{fill:transparent}
.st-dot{fill:#fff;stroke:var(--signage);stroke-width:1.9}
.st-g[data-tap]{cursor:pointer}
.st-g.is-r .st-dot{fill:var(--yamanote);stroke:#fff;stroke-width:2.6}
.st-g.is-w .st-dot{fill:var(--alert);stroke:#fff;stroke-width:2.6}
.st-g.is-blank .st-dot{fill:#fff;stroke:#E0A030;stroke-width:2.6;stroke-dasharray:2.4 1.6}
.lbl--blank{fill:#E0A030;font-weight:700;font-size:12px}
.lbl{font-family:var(--g);pointer-events:none;paint-order:stroke}
.lbl--st{fill:#D6E3EC;font-size:9px;stroke:#0B1319;stroke-width:2.4}
.lbl--far{fill:#55697A;font-size:7.5px;stroke:#0B1319;stroke-width:1.6;opacity:.62}
.lbl--mk{fill:#fff;font-size:12.5px;font-weight:700;stroke:#0B1319;stroke-width:3.8}
.lbl--ward{fill:#5D8098;font-size:9.5px;letter-spacing:.18em;stroke:none}
.lbl--pref{fill:#37596E;font-size:12px;letter-spacing:.4em;stroke:none}
.lbl--geo{fill:#2B4E64;font-size:11px;letter-spacing:.32em;stroke:none}
.lbl--line{font-size:8px;stroke:#0B1319;stroke-width:2.2}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.prog__b{display:flex;gap:4px;flex:1}
.prog__b i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.prog__b i.ok{background:var(--yamanote)}.prog__b i.ng{background:var(--alert)}.prog__b i.now{background:var(--signage)}
.prog button{flex:none;background:none;border:none;font-family:var(--g);font-size:11px;color:var(--muted);
cursor:pointer;text-decoration:underline;padding:0}
.verdict{font-size:17px;font-weight:600;margin-bottom:9px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--alert)}
.explain{font-size:13px;line-height:1.85}
.why{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.why h5{font-family:var(--lat);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
margin-bottom:6px;font-weight:600}
.why .row{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:4px 0;color:var(--muted)}
.why .row b{color:var(--ink);font-weight:600}
.why .mk{flex:none;width:14px;text-align:center;font-family:var(--lat);font-size:11px}
.why .mk.r{color:var(--ok)}.why .mk.w{color:var(--alert)}
.route{display:flex;flex-direction:column;gap:0;margin:6px 0}
.route .leg{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0}
.route .leg u{width:4px;align-self:stretch;min-height:22px;border-radius:2px;text-decoration:none;flex:none;margin-left:4px}
.route .leg .nm{font-weight:600}
.route .leg .sub{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.route .node{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.route .node b{color:var(--ink);font-weight:600;font-size:13px}
.route .node i{width:9px;height:9px;border-radius:50%;border:2px solid var(--signage);background:#fff;
flex:none;margin-left:1.5px;font-style:normal}
.spot-hero{display:flex;gap:13px;align-items:center;background:var(--paper);border-radius:5px;padding:12px 13px;margin-bottom:11px}
.spot-hero .ic{flex:none;width:58px;height:58px;background:#fff;border:1px solid var(--rule);border-radius:5px;
display:grid;place-items:center;color:var(--signage)}
.spot-hero .ic svg{width:40px;height:40px;display:block}
.spot-hero h4{font-size:16px;font-weight:600}.spot-hero p{font-size:11.5px;color:var(--muted);margin-top:2px}
.ic-sm{flex:none;display:grid;place-items:center;width:25px;height:25px;color:var(--muted)}
.ic-sm svg{width:25px;height:25px;display:block}
.score{font-family:var(--mono);font-size:42px;line-height:1}.score small{font-size:15px;color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:13px}
.stats div{font-size:12px;color:var(--muted)}.stats b{display:block;font-family:var(--mono);font-size:18px;color:var(--ink)}
.info-pop{position:absolute;left:9px;right:9px;bottom:9px;background:#fff;border-radius:5px;padding:11px 13px;
box-shadow:0 10px 30px -12px rgba(0,0,0,.6);z-index:3}
.info-pop h4{font-size:16px}.info-pop .r{font-family:var(--lat);font-size:9px;letter-spacing:.18em;
text-transform:uppercase;color:var(--muted)}
.info-pop p{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:4px}
.foot{font-size:10.5px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.85}
@media(max-width:480px){#app{padding:0 12px 48px}.topbar{margin:0 -12px 12px}
#navBar{padding:6px 12px}.nav__b{font-size:9.5px;padding:6px 2px}.nav__b i{font-size:14px}
.card{padding:14px}}
@media(prefers-reduced-motion:no-preference){.plate,.card{animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
<style>
#userBar{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:8px 11px;background:#fff;
border:1px solid var(--rule);border-radius:5px;font-size:12.5px}
.ub__who{flex:1;color:var(--ink);font-weight:600}
.savebtn{background:var(--signage);color:#fff;border:none;border-radius:4px;padding:7px 15px;
font-family:var(--g);font-size:12.5px;font-weight:600;cursor:pointer}
.savebtn.is-dirty{background:var(--alert);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}
.savebtn.is-dirty::after{content:' ●';font-size:9px;vertical-align:2px}
.ub__lo{background:none;border:1px solid var(--rule);border-radius:4px;padding:6px 11px;
font-family:var(--g);font-size:11.5px;color:var(--muted);cursor:pointer}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.fld input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:4px;
font-family:var(--g);font-size:15px;color:var(--ink);background:#fff}
.fld input:focus{outline:none;border-color:var(--signage)}
.err{color:var(--alert);font-size:12px;min-height:17px;margin-top:4px}
.acrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px}
.acrow:last-child{border-bottom:none}
.acrow b{font-weight:600}.acrow span{color:var(--muted);font-size:11.5px}
.acrow button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:11px;
cursor:pointer;text-decoration:underline;font-family:var(--g)}
.btn--learn{background:#2F5E3F}.btn--learn:hover{background:#3A7350}
.seq{max-height:330px;overflow-y:auto}
.seq__row{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px solid #EFF1ED;font-size:13.5px}
.seq__row:last-child{border-bottom:none}
.seq__n{flex:none;width:22px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.seq__row u{flex:none;width:4px;height:20px;border-radius:2px;text-decoration:none}
.seq__nm{font-weight:600}
.seq__x{display:flex;gap:2px;margin-left:6px}
.seq__w{margin-left:auto;font-size:11px;color:var(--muted)}
.seq__t{flex:none;font-size:9.5px;color:#fff;background:#8FA3B3;border-radius:9px;padding:1px 6px}
.stages{display:grid;gap:7px}
.stage{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);
border-radius:4px;padding:10px 12px;cursor:pointer;font-family:var(--g);color:var(--ink);width:100%;text-align:left}
.stage:hover{border-color:var(--signage)}
.stage__i{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);
display:grid;place-items:center;font-family:var(--lat);font-size:11px;color:var(--muted)}
.stage__t{font-size:13.5px}
.stage__n{margin-left:auto;font-size:11px;color:var(--muted)}
.stage.is-done{background:#F6FBEC;border-color:var(--yamanote)}
.stage.is-done .stage__i{background:var(--yamanote);border-color:var(--yamanote);color:#123}
.tray{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:9px;background:var(--paper);
border-radius:4px;align-items:center}
.tag{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:9px 13px;
font-family:var(--g);font-size:14px;color:var(--ink);cursor:pointer}
.tag:hover:not(:disabled){border-color:var(--signage)}
.tag.is-used{opacity:.3;cursor:default}
.tag.is-ok{background:var(--yamanote);border-color:var(--yamanote);color:#123;cursor:default;font-size:13px;padding:6px 10px}
.tag.is-bad{background:#FDF3F4;border-color:var(--alert);color:var(--alert);cursor:default}
.stage.is-due{background:#FFF6E8;border-color:#E0A030}
.stage.is-due .stage__i{background:#E0A030;border-color:#E0A030;color:#fff}
.stage.is-due .stage__n{color:#B5771A;font-weight:600}
.card.rev{border-color:#E0A030;border-width:2px;padding:15px}
.btn--admin{background:#4A3B6B}.btn--admin:hover{background:#5C4A84}
.card.admin{background:#F4F1FA;border-color:#B6A6D8}
.admchk{padding:7px 9px;background:#F4F1FA;border:1px solid #B6A6D8;border-radius:4px}
.maplock{position:absolute;left:7px;top:7px;z-index:4;background:rgba(6,12,17,.86);color:#fff;
border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:6px 11px;font-family:var(--g);
font-size:11px;cursor:pointer;letter-spacing:.03em}
.maplock.is-on{background:var(--yamanote);color:#123;border-color:var(--yamanote);font-weight:600}
#navBar{display:flex;gap:5px;margin:0;padding:7px 16px 7px;background:var(--paper);
border-bottom:1px solid var(--rule)}
.nav__b{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:#fff;
border:1px solid var(--rule);border-radius:5px;padding:7px 3px;font-family:var(--g);font-size:10.5px;
color:var(--muted);cursor:pointer;line-height:1.25}
.nav__b i{font-style:normal;font-size:15px;line-height:1}
.nav__b:hover{border-color:var(--signage);color:var(--ink)}
.nav__b.is-cur{background:var(--signage);border-color:var(--signage);color:#fff}
.pbar{display:block;height:5px;background:#E2E6DF;border-radius:3px;overflow:hidden;margin:5px 0 2px}
.pbar i{display:block;height:100%;background:var(--yamanote);border-radius:3px;transition:width .5s ease}
.ring{flex:none}
.badge{font-style:normal;font-size:9.5px;background:#E0A030;color:#fff;border-radius:9px;
padding:1px 7px;vertical-align:2px;font-weight:600}
.badge.b-due{background:#B5771A}
.lvl.is-master{background:#FFFBF2;border-color:#E0A030}
.cheer{margin-top:11px;padding:10px 12px;background:#FFF6E8;border:1px solid #E0A030;border-radius:5px;
font-size:13.5px;font-weight:600;color:#8A5A12;text-align:center}
.lgo{display:inline-grid;place-items:center;font-family:var(--lat);font-weight:700;
letter-spacing:-.03em;line-height:1;vertical-align:middle;box-sizing:border-box;
overflow:hidden;font-stretch:normal;aspect-ratio:1/1;
flex:0 0 auto !important;align-self:center}
.lgo--sq{border-radius:3px}
.lgo--rg{border-radius:50%;background:#fff}
.ltag{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px 2px 3px;
border-radius:11px;background:var(--paper);border:1px solid var(--rule);margin:0 3px 3px 0;white-space:nowrap}

.wardname--hl{fill:#CFE8A8;font-size:13px;font-weight:700;letter-spacing:.2em}
.geo-wardname{fill:#fff;font-weight:700;letter-spacing:.04em;stroke:#0B1319;stroke-width:3;paint-order:stroke;text-anchor:middle}
.wardname{fill:#7FA0B8;font-size:10.5px;letter-spacing:.16em;stroke:#101A22;stroke-width:2.6;
paint-order:stroke;font-weight:600}
.hero{background:var(--signage);color:#fff;border-radius:6px;padding:15px 16px;margin-bottom:14px}
.hero__t{font-size:17px;font-weight:600;letter-spacing:.04em}
.hero__s{font-size:11.5px;color:#8FA3B3;margin-top:1px}
.hero__row{display:flex;align-items:center;gap:16px;margin-top:13px;flex-wrap:wrap}
.hero__row>div{flex:1;min-width:104px}
.hero__k{font-size:10.5px;color:#8FA3B3}
.hero__v{font-family:var(--mono);font-size:19px;margin:1px 0}
.hero .pbar{background:rgba(255,255,255,.16)}
.hero .ring text{fill:#fff}
.pick{display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--rule);
border-radius:6px;padding:14px 15px;margin-bottom:9px;cursor:pointer;font-family:var(--g);
color:var(--ink);text-align:left}
.pick:hover{border-color:var(--signage);transform:translateX(2px);transition:transform .12s}
.pick__i{flex:none;width:38px;height:38px;border-radius:9px;background:var(--paper);display:grid;
place-items:center;font-size:19px}
.pick__b{flex:1}.pick__b b{display:block;font-size:15px;font-weight:600}
.pick__b em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.pick__a{color:var(--rule);font-size:20px}
.pick--rev{background:#FFF6E8;border-color:#E0A030}
.pick--rev .pick__i{background:#E0A030;color:#fff}
.pick--adm{background:#F4F1FA;border-color:#B6A6D8}
.pick--adm .pick__i{background:#4A3B6B;color:#fff}
.nav--adm .nav__b{background:#F4F1FA;border-color:#B6A6D8}
.nav--adm .nav__b.is-cur{background:#4A3B6B;border-color:#4A3B6B;color:#fff}
.warn{background:#FFF9E8;border:1px solid #E0C070;border-radius:5px;padding:11px 13px;margin-top:10px;
font-size:11.5px;line-height:1.7;color:#6B5418}
.warn b{color:#4A3A0C}
.warn ul{margin:5px 0 0 15px;padding:0}
.warn li{margin-bottom:4px}
.warn__k{margin-top:7px;padding-top:6px;border-top:1px solid #E0C070;font-family:var(--mono);font-size:10.5px}
.fold{display:flex;align-items:center;cursor:pointer}
.fold__a{margin-left:auto;font-size:11px;color:var(--muted)}
.srow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.srow__n{flex:0 0 118px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .pbar{flex:1;margin:0}
.srow__v{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:56px;text-align:right}
.srow__v em{font-style:normal;font-size:9.5px;display:block}
.spark{display:flex;align-items:flex-end;gap:3px;height:48px;margin-top:6px}
.spark__b{flex:1;background:#E2E6DF;border-radius:2px;position:relative;display:flex;align-items:flex-end}
.spark__b i{display:block;width:100%;background:var(--yamanote);border-radius:2px}
.sublist{margin:6px 0 4px 12px;padding-left:10px;border-left:2px solid var(--rule)}
.lrow{display:flex;align-items:center;gap:9px;width:100%;background:#fff;border:1px solid var(--rule);
border-radius:4px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-family:var(--g);
font-size:13.5px;color:var(--ink);text-align:left}
.lrow:hover:not(:disabled){border-color:var(--signage)}
.lrow.is-sel{border-color:var(--signage);border-width:2px;padding:8px 10px;background:#F7F9F5}
.lrow.is-lock{opacity:.45;cursor:not-allowed}
.lrow__b{flex:none;width:22px;display:grid;place-items:center}
.lrow__b .dot{display:block;width:7px;height:7px;border-radius:50%;background:var(--rule)}
.lrow__n{flex:1;font-weight:600}
.lrow__x{flex:none;font-size:10.5px;color:var(--muted)}
.bdg{display:inline-grid;place-items:center;line-height:0}
.diffbox{background:var(--paper);border-radius:5px;padding:12px;margin:2px 0 10px}
.diffbox__t{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.dbtn{position:relative;flex:1;min-width:84px;background:#fff;border:1px solid var(--rule);
border-radius:4px;padding:10px 8px;cursor:pointer;font-family:var(--g);font-size:14px;color:var(--ink)}
.dbtn small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.dbtn[aria-pressed=true]{background:var(--signage);color:#fff;border-color:var(--signage)}
.dbtn[aria-pressed=true] small{color:#93A7B6}
.dbtn.is-clear{border-color:var(--yamanote);background:#F6FBEC}
.dbtn.is-clear[aria-pressed=true]{background:#5C8A20;border-color:#5C8A20;color:#fff}
.dbtn .chk{position:absolute;top:3px;right:5px;font-size:10px;color:#5C8A20;font-weight:700}
.dbtn.is-clear[aria-pressed=true] .chk{color:#fff}
.lvl.is-open{border-color:var(--signage);border-width:2px;padding:11px 13px}
.sortbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.sortb{background:#fff;border:1px solid var(--rule);border-radius:13px;padding:5px 11px;
font-family:var(--g);font-size:11.5px;color:var(--muted);cursor:pointer}
.sortb i{font-style:normal;margin-left:3px;font-size:9px}
.sortb.is-on{background:var(--signage);color:#fff;border-color:var(--signage)}
.opgrp{font-size:10.5px;color:var(--muted);font-weight:600;margin:7px 0 3px;padding-bottom:2px;
border-bottom:1px solid var(--rule)}
.clearbox{display:flex;align-items:center;gap:11px;background:#F6FBEC;border:1px solid var(--yamanote);
border-radius:5px;padding:11px 13px;margin-top:12px}
.clearbox b{display:block;font-size:14px}
.clearbox span{display:block;font-size:11px;color:var(--muted)}
.clearbox>div{flex:1}

  const out=[];let i=0,lat=0,lon=0;
  while(i<s.length){
    let r=0,sh=0,b;
    do{b=s.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);
    lat+=(r&1)?~(r>>1):(r>>1);
    r=0;sh=0;
    do{b=s.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20);
    lon+=(r&1)?~(r>>1):(r>>1);
    out.push([lon/1e5,lat/1e5]);
  }
  return out;
}

  for(let k=0;k<L.st.length-1;k++){
    const a=L.st[k],b=L.st[k+1];
    ADJ[a].push({to:b,line:L.i});ADJ[b].push({to:a,line:L.i});
  }
  if(L.loop&&L.st.length>2){
    const a=L.st[L.st.length-1],b=L.st[0];

/* 乗換回数を最優先、次に駅数で最短経路（ダイクストラ）
   状態=(駅,乗車中の路線)。line=-1 は「まだ乗っていない」= 最初の乗車は乗換に数えない */
const TR=1000;
function route(from,to,allow){
  const ok=l=>!allow||allow.has(l);
  const best={},prev={},key=(s,l)=>s+'@'+l;
  const pq=[];
  const push=(c,s,l)=>{pq.push([c,s,l]);let i=pq.length-1;
    while(i>0){const p=(i-1)>>1;if(pq[p][0]<=pq[i][0])break;const t=pq[p];pq[p]=pq[i];pq[i]=t;i=p}};
  const pop=()=>{const top=pq[0],last=pq.pop();if(pq.length){pq[0]=last;let i=0;
    for(;;){let l=2*i+1,r=l+1,m=i;
      if(l<pq.length&&pq[l][0]<pq[m][0])m=l;
      if(r<pq.length&&pq[r][0]<pq[m][0])m=r;
      if(m===i)break;const t=pq[m];pq[m]=pq[i];pq[i]=t;i=m}}return top};
  best[key(from,-1)]=0;push(0,from,-1);
  let goal=null;
  while(pq.length){
    const cur=pop(),c=cur[0],s=cur[1],l=cur[2];
    if(c>(best[key(s,l)]!==undefined?best[key(s,l)]:1e18))continue;
    if(s===to&&l!==-1){goal=key(s,l);break}
    const es=ADJ[s];
    for(let i=0;i<es.length;i++){
      const e=es[i];
      if(!ok(e.line))continue;
      const nc=c+1+((l===-1||e.line===l)?0:TR);
      const k2=key(e.to,e.line);
      if(best[k2]===undefined||nc<best[k2]){best[k2]=nc;prev[k2]=key(s,l);push(nc,e.to,e.line)}
    }
  }
  if(goal===null)return null;
  const path=[];let k=goal;
  while(k!==undefined){const p=k.split('@');path.unshift({st:+p[0],line:+p[1]});k=prev[k]}
  const legs=[];
  for(let i=1;i<path.length;i++){
    const pv=path[i-1],cu=path[i];
    if(!legs.length||legs[legs.length-1].line!==cu.line)
      legs.push({line:cu.line,from:pv.st,to:cu.st,hops:1,via:[pv.st,cu.st]});
    else{const L=legs[legs.length-1];L.to=cu.st;L.hops++;L.via.push(cu.st)}
  }
  return {legs:legs,hops:legs.reduce((a,l)=>a+l.hops,0),transfers:Math.max(0,legs.length-1)};
}
const hopsOf=(a,b,allow)=>{const r=route(a,b,allow);return r?r.hops:99};

  const r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);
  return (r*299+g*587+b*114)/1000 < 150;

function crPath(pts,closed){
  const n=pts.length;
  if(n<3)return 'M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
  const at=i=>closed?pts[((i%n)+n)%n]:pts[Math.max(0,Math.min(n-1,i))],KK=0.16;
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){
    const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    d+='C'+(p1[0]+(p2[0]-p0[0])*KK).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])*KK).toFixed(1)+','
      +(p2[0]-(p3[0]-p1[0])*KK).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])*KK).toFixed(1)+','
      +p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d+(closed?'Z':'');
}

function boxOf(idxs,ar,pad,minH){
  const xs=idxs.map(i=>P[i].x),ys=idxs.map(i=>P[i].y);
  const cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
  const cy=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;
  let h=Math.max(Math.max.apply(null,ys)-Math.min.apply(null,ys)+pad*2,minH),w=h/ar;
  const nw=Math.max.apply(null,xs)-Math.min.apply(null,xs)+pad*2;
  if(w<nw){w=nw;h=w*ar}
  return[cx-w/2,cy-h/2,w,h];
}
const FULL=(()=>{let w=(BOUND[2]-BOUND[0])*1.06,h=w*AR_T;
  const bh=(BOUND[3]-BOUND[1])*1.06; if(h<bh){h=bh;w=h/AR_T}
  return[(BOUND[0]+BOUND[2])/2-w/2,(BOUND[1]+BOUND[3])/2-h/2,w,h]})();

/* ===== アカウント（簡易・端末内保存） =====
   パスワードは平文では保存せず、ハッシュ化した値だけを保存します。
   端末内の学習記録を分けるための簡易機能で、本格的な認証ではありません。 */
const AKEY='trm:accounts', SKEY='trm:lastUser';
/* 保存先：Claudeのアーティファクト内では window.storage、
   一般のWebサーバーに置いた場合は localStorage を使う */
const STORE=(()=>{
  const ws=(typeof window!=='undefined')&&window.storage&&typeof window.storage.get==='function';
  if(ws)return{
    kind:'artifact',
    get:async k=>{try{return await window.storage.get(k)}catch(e){return null}},
    set:async(k,v)=>{try{return await window.storage.set(k,v)}catch(e){return null}}
  };
  let ok=false;
  try{localStorage.setItem('trm:test','1');localStorage.removeItem('trm:test');ok=true}catch(e){}
  if(ok)return{
    kind:'local',
    get:async k=>{const v=localStorage.getItem(k);return v===null?null:{value:v}},
    set:async(k,v)=>{localStorage.setItem(k,v);return{}}
  };
  const mem={};
  return{kind:'memory',
    get:async k=>mem[k]===undefined?null:{value:mem[k]},
    set:async(k,v)=>{mem[k]=v;return{}}};
})();
async function sha(str){
  try{
    const b=new TextEncoder().encode(str+'::trm-salt');
    const h=await crypto.subtle.digest('SHA-256',b);
    return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;
    return 'f'+(h>>>0).toString(16);
  }
}

/* ===== 復習（間隔反復） ===== */
const REVIEW_DAYS=[1,3,7,16,35,90];
const DAY=86400000;
/* 記録は2種類（2026-09-29 に作り直し）
   progress.stageDone["路線:区間番号"]=合格した時刻 …… 区間に合格したか（進み具合の表示用）
   progress.srs["路線:駅"]={n,last,next} …………… 復習の予定は駅ごとに1つ。どの区間で合格しても同じ記録を更新する
   復習は「重ならない区間」の単位で出す（全線通しの区間は復習に出さない）ので、同じ駅を二重に復習しない */
const srsKey=(li,g)=>li+':'+g;
const stRange=(li,si)=>{const L=LINES[li],r=stagesOf(L)[si];return r?L.st.slice(r[0],r[1]):[]};
const isFullStage=(li,si)=>{const L=LINES[li],r=stagesOf(L)[si];return !!r&&stagesOf(L).length>1&&r[0]===0&&r[1]===L.st.length};
/* 区間の駅の記録をまとめたもの（いちばん早い復習日・いちばん低い段階）。記録がなければ null */
function stRec(li,si){
  const s=state.progress.srs||{};let n=99,next=Infinity,any=false;
  stRange(li,si).forEach(g=>{const v=s[srsKey(li,g)];if(v){any=true;n=Math.min(n,v.n);next=Math.min(next,v.next)}});
  return any?{n:n,next:next}:null;
}
function markCleared(li,si,ok){
  const p=state.progress,now=Date.now();
  p.srs=p.srs||{};p.stageDone=p.stageDone||{};
  stRange(li,si).forEach(g=>{
    const k=srsKey(li,g),cur=p.srs[k];
    if(ok){
      /* 初めて → 1段目。復習日が来ていた駅だけ間隔を伸ばす（来ていない駅はそのまま） */
      if(!cur)p.srs[k]={n:0,last:now,next:now+REVIEW_DAYS[0]*DAY};
      else if(cur.next<=now){const n=Math.min(REVIEW_DAYS.length-1,cur.n+1);
        p.srs[k]={n:n,last:now,next:now+REVIEW_DAYS[n]*DAY}}
    }else if(cur){
      /* 不合格：すでに覚えていた駅は間隔を最初に戻す（まだ覚えていない駅は記録しない） */
      p.srs[k]={n:0,last:now,next:now+REVIEW_DAYS[0]*DAY};
    }
  });
  if(ok){
    p.stageDone[stKey(li,si)]=now;
    /* 全線通しに合格したら、6駅ずつの区間もすべて合格扱いにする */
    if(isFullStage(li,si))stagesOf(LINES[li]).forEach((r,j)=>{if(!p.stageDone[stKey(li,j)])p.stageDone[stKey(li,j)]=now});
  }
  touch();
}
function dueList(){
  const out=[],now=Date.now(),s=state.progress.srs||{};
  LINES.forEach(L=>{
    if(L.level>state.level&&!state.admin)return;
    stagesOf(L).forEach((r,si)=>{
      if(!stDone(L.i,si)||isFullStage(L.i,si))return;
      let over=-1,n=99;
      stRange(L.i,si).forEach(g=>{const v=s[srsKey(L.i,g)];
        if(v&&v.next<=now){over=Math.max(over,Math.floor((now-v.next)/DAY));n=Math.min(n,v.n)}});
      if(over>=0)out.push({li:L.i,si:si,over:over,n:n});
    });
  });
  return out.sort((a,b)=>b.over-a.over);
}
/* 以前の区間の刻み方（6→12→24駅…と重なる）。古い記録を引き継ぐときだけ使う */
function oldStagesOf(L){
  const n=L.st.length,out=[];
  if(n<=6)return[[0,n]];
  let size=6;
  while(true){
    for(let s=0;s<n;s+=size){
      let e=Math.min(n,s+size);
      if(n-e>0&&n-e<6)e=n;
      if(e-s>=2)out.push([s,e]);
      if(e>=n)break;
    }
    if(size>=n)break;
    size=Math.min(n,size*2);
  }
  const last=out[out.length-1];
  if(!last||last[1]-last[0]<n)out.push([0,n]);
  const seen={},uniq=[];
  out.forEach(x=>{const k=x[0]+'-'+x[1];if(!seen[k]){seen[k]=1;uniq.push(x)}});
  return uniq;
}
/* 古い記録（progress.study：区間ごとの復習予定）を、駅ごとの記録と新しい区間の合格に引き継ぐ。
   古い記録は消さずに残す（stageDone がすでにあれば何もしない） */
function migrateStudy(p){
  if(p.stageDone)return;
  p.stageDone={};p.srs={};
  const old=p.study||{},now=Date.now();
  const fullDone={};
  for(const k in old){
    const a=k.split(':'),li=+a[0],si=+a[1],L=LINES[li];
    if(!L)continue;
    const r=oldStagesOf(L)[si];if(!r)continue;
    let v=old[k];
    if(v===1||v===true||!v||typeof v!=='object')v={n:0,last:now,next:now+REVIEW_DAYS[0]*DAY};
    if(r[0]===0&&r[1]===L.st.length)fullDone[li]=1;
    for(let j=r[0];j<r[1];j++){
      const sk=srsKey(li,L.st[j]),cur=p.srs[sk];
      if(!cur||v.n>cur.n||(v.n===cur.n&&v.next<cur.next))p.srs[sk]={n:v.n,last:v.last||now,next:v.next};
    }
  }
  LINES.forEach(L=>{
    stagesOf(L).forEach((r,si)=>{
      const full=isFullStage(L.i,si);
      const ok=full?!!fullDone[L.i]:L.st.slice(r[0],r[1]).every(g=>p.srs[srsKey(L.i,g)]);
      if(ok)p.stageDone[stKey(L.i,si)]=now;
    });
  });
}

function withNeighbors(idxs,li){
  const set={},add=i=>{if(i!=null&&i>=0)set[i]=1};
  idxs.forEach(add);
  idxs.forEach(i=>{
    const ls=(li!=null&&ST[i].lines.indexOf(li)>=0)?[li]:ST[i].lines;
    ls.forEach(l=>{
      const L=LINES[l],k=L.st.indexOf(i);
      if(k<0)return;
      let a=k-1,b=k+1;
      if(L.loop){a=(a+L.st.length)%L.st.length;b=b%L.st.length}
      if(a>=0&&a<L.st.length)add(L.st[a]);
      if(b>=0&&b<L.st.length)add(L.st[b]);

function fitBox(idxs,extra){
  const pts=idxs.map(i=>P[i]).concat(extra||[]);
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  const y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  let w=x1-x0,h=y1-y0;
  const pad=Math.max(38,Math.max(w,h)*0.16);
  w+=pad*2;h+=pad*2;
  const MINW=120;
  if(w<MINW){h+=MINW-w;w=MINW}

  let ar=h/w;
  const AR_MIN=0.34,AR_MAX=1.15;      // 横長すぎ・縦長すぎを防ぐ
  if(ar<AR_MIN){ar=AR_MIN;h=w*ar}

  +(ic?icon(ic,'ic-sm'):'')+'<span><b>'+n+'</b>　'+note+'</span></div>';
const lineOf=i=>{const al=activeLines();return ST[i].lines.filter(l=>al.has(l))};
/* 出題する駅の選び方：まだ出ていない駅・間違えた駅・しばらく出ていない駅を優先する。
   1回のクイズの中では同じ駅を出さない（候補が足りないときだけ重複を許す）。
   記録は stats.byStation[駅]=[出題数,正解数,最後に出た時刻,最後に正解したら1] */
function stWeight(i,now){
  const s=state.progress.stats,t=s&&s.byStation&&s.byStation[i];
  if(!t||!t[0])return 4;
  let w=1+4*(t[0]-t[1])/t[0];
  if(t[3]===0)w+=4;
  if(t[2]){
    w+=Math.min(3,(now-t[2])/DAY/2);
    if(t[3]===1&&now-t[2]<10*60000)w*=0.3;
  }else w+=1.5;
  return w;
}
function wPick(cands){
  const used=state.session&&state.session.used;
  let c=used?cands.filter(i=>!used.has(i)):cands.slice();
  if(!c.length)c=cands.slice();
  const now=Date.now(),ws=c.map(i=>stWeight(i,now));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let k=0;k<c.length;k++){r-=ws[k];if(r<=0)return c[k]}
  return c[c.length-1];
}
function genMap(){const t=ST[wPick(poolIdx())];
  return{mode:'map',target:t.i,plate:plate(t),text:'この駅は地図のどこ？　丸をタップしてください。'}}
function genQuiz(){
  const ps=poolIdx(),al=[...activeLines()];
  const kinds=al.length>1?['line','next','ward','near']:['next','ward','near'];
  const k=pick(kinds), o4=(c,from)=>shuffle([c].concat(shuffle(from.filter(x=>x!==c)).slice(0,3)));
  if(k==='line'){
    const i=wPick(ps),ls=lineOf(i);if(!ls.length)return genQuiz();
    const ans=pick(ls),others=al.filter(l=>ST[i].lines.indexOf(l)<0);
    if(others.length<3)return genQuiz();
    return{mode:'quiz',kind:k,subject:i,answer:ans,options:o4(ans,others),optType:'line',
      plate:plate(ST[i],{}),text:ST[i].ja+'駅を通っている路線はどれ？'};
  }
  if(k==='ward'){
    const i=wPick(ps),ws=[...new Set(ST.filter(s=>s.level<=state.level).map(s=>s.ward))];
    if(ws.length<4)return genQuiz();
    return{mode:'quiz',kind:k,subject:i,answer:ST[i].ward,options:o4(ST[i].ward,ws),optType:'ward',
      plate:plate(ST[i],{blank:false}),text:ST[i].ja+'駅があるのは何区？'};
  }
  if(k==='next'){
    const cs=new Set(LINES.filter(L=>activeLines().has(L.i)&&L.st.length>3).map(L=>L.i));
    const subs=ps.filter(i=>ST[i].lines.some(l=>cs.has(l)));
    if(!subs.length)return genQuiz();
    const s0=wPick(subs),L=LINES[pick(ST[s0].lines.filter(l=>cs.has(l)))],n=L.st.length,at=L.st.indexOf(s0);
    const dir=pick([1,-1]);let nx=at+dir;
    if(L.loop)nx=(nx+n)%n; else if(nx<0||nx>=n)nx=at-dir;
    if(nx===at)return genQuiz();
    const sub=L.st[at],ans=L.st[nx];
    const pool2=L.st.filter(x=>x!==sub&&x!==ans);
    if(pool2.length<3)return genQuiz();
    return{mode:'quiz',kind:k,subject:sub,line:L.i,answer:ans,options:o4(ans,pool2),optType:'st',
      plate:plate(ST[sub],dir>0?{right:'?'}:{left:'?'}),
      text:L.ja+'で '+ST[sub].ja+' の'+(dir>0?'次':'ひとつ前')+'の駅は？'};
  }
  const b=wPick(ps),cs=shuffle(ps.filter(x=>x!==b)).slice(0,4);
  const al2=activeLines();
  const hs=cs.map(x=>({x:x,h:hopsOf(b,x,al2)}));
  hs.sort((p,q)=>p.h-q.h);
  if(hs[0].h>=90||hs[0].h===hs[1].h)return genQuiz();
  return{mode:'quiz',kind:'near',subject:b,answer:hs[0].x,options:shuffle(cs),optType:'st',hops:hs,
    plate:plate(ST[b]),text:ST[b].ja+'から駅数が最も少ないのはどれ？'};
}
function genRoute(){
  const ps=poolIdx(),al=activeLines();
  /* 路線が1本だけ（路線ごとのクイズ）だと答えが必ずその路線になり、選択肢も1つしか作れないので出さない */
  if(al.size<2)return genQuiz();
  /* 出発駅を優先度で選び、行き先はランダム。うまく作れなければ出発駅もランダムにする */
  let a=wPick(ps),b,r,g=0;
  do{b=pick(ps);r=(a!==b)?route(a,b,al):null;g++}
  while((!r||r.hops<3)&&g<40);
  if(!r||r.hops<3){g=0;
    do{a=pick(ps);b=pick(ps);r=(a!==b)?route(a,b,al):null;g++}
    while((!r||r.hops<3)&&g<60);
  }
  if(!r)return genQuiz();
  const first=r.legs[0].line;
  const others=[...al].filter(l=>l!==first&&ST[a].lines.indexOf(l)<0);
  const at=ST[a].lines.filter(l=>al.has(l)&&l!==first);
  const opts=shuffle([first].concat(shuffle(at).slice(0,2)).concat(shuffle(others).slice(0,3))).slice(0,4);
  if(opts.indexOf(first)<0)opts[0]=first;
  /* 選んだ路線が少なくて4つに満たないときは、出発駅を通らないほかの路線で補う */
  if(opts.length<4){
    const extra=shuffle(LINES.map(L=>L.i).filter(l=>opts.indexOf(l)<0&&ST[a].lines.indexOf(l)<0));
    while(opts.length<4&&extra.length)opts.push(extra.shift());
  }
  return{mode:'route',from:a,to:b,r:r,answer:first,options:shuffle(opts),optType:'line',
    plate:plate(ST[a],{right:'?'}),
    text:ST[a].ja+' から '+ST[b].ja+' へ。まず何線に乗る？'};
}
function genSpot(){
  const ps=pool().filter(s=>s.spots.length);
  if(ps.length<4)return genQuiz();
  const dir=pick(['toSpot','toStation']),s=ST[wPick(ps.map(x=>x.i))],sp=pick(s.spots);
  if(dir==='toSpot'){
    /* 同じ名所が複数駅の近くに登録されていることがある（例:明治神宮）ので、
       名前で重複排除し、正解と同名の候補も除外する */
    const cand=shuffle(ps.filter(x=>x.i!==s.i).reduce((a,x)=>a.concat(x.spots),[]));
    const seen=new Set([sp[0]]),oth=[];
    for(const p2 of cand){ if(seen.has(p2[0]))continue; seen.add(p2[0]); oth.push(p2[0]); if(oth.length===3)break; }
    if(oth.length<3)return genQuiz();
    return{mode:'spot',dir:dir,station:s.i,answerText:sp[0],icon:sp[1],optType:'text',
      options:shuffle([sp[0]].concat(oth)),plate:plate(s),text:s.ja+'駅の近くにあるのは？'};
  }
  const oth=shuffle(ps.filter(x=>x.i!==s.i)).slice(0,3).map(x=>x.i);
  return{mode:'spot',dir:dir,answer:s.i,spotText:sp[0],icon:sp[1],optType:'st',
    options:shuffle([s.i].concat(oth)),plate:plate(s,{blank:true}),text:'「'+sp[0]+'」の最寄り駅は？'};
}
const GEN={map:genMap,quiz:genQuiz,route:genRoute,spot:genSpot};
const SPOT_IX={};ST.forEach(s=>s.spots.forEach(p=>SPOT_IX[p[0]]={st:s.i,ic:p[1]}));

/* ===== 学習モード ===== */
/* 区間の刻み方：重ならない6駅以下の区間を積み上げ、最後に全線を通しで1回。
   7駅以下の路線は区間を分けず1回で覚える。2区間の路線（8〜12駅）は、2つ目の区間の
   「つながり」問題で全線がつながるので、全線通しは付けない
   （例：大江戸線38駅 → 6駅前後×7区間＋全線通し＝8ステージ） */
const MIN_SEG=6;
const STAGE_CACHE={};
function stagesOf(L){
  if(STAGE_CACHE[L.i])return STAGE_CACHE[L.i];
  const n=L.st.length,out=[];
  if(n<=MIN_SEG+1)out.push([0,n]);
  else{
    const k=Math.ceil(n/MIN_SEG);
    for(let j=0;j<k;j++)out.push([Math.round(j*n/k),Math.round((j+1)*n/k)]);
    if(k>=3)out.push([0,n]);
  }
  return STAGE_CACHE[L.i]=out;
}
const stKey=(li,si)=>li+':'+si;
const stDone=(li,si)=>!!(state.progress.stageDone&&state.progress.stageDone[stKey(li,si)]);
/* 復習どき：合格済みの（全線通し以外の）区間に、復習日が来た駅があるとき */
const stDue=(li,si)=>{
  if(!stDone(li,si)||isFullStage(li,si))return false;
  const s=state.progress.srs||{},now=Date.now();
  return stRange(li,si).some(g=>{const v=s[srsKey(li,g)];return v&&v.next<=now});
};
function lineProgress(L){
  const sg=stagesOf(L);
  let n=0,rev=0;
  sg.forEach((s,i)=>{if(stDone(L.i,i)){n++;if(stDue(L.i,i))rev++}});
  return{done:n,total:sg.length,stages:sg,pct:Math.round(n/sg.length*100),due:rev};
}
function ring(pct,size){
  const r=(size-4)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#E2E6DF" stroke-width="3"/>'
   +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(pct===100?'#E0A030':'#9ACD32')
   +'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" '
   +'stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
   +'<text x="'+size/2+'" y="'+(size/2+3.5)+'" text-anchor="middle" font-size="'+(size*0.3)+'" '
   +'font-family="ui-monospace,monospace" fill="#1A2530">'+pct+'</text></svg>';
}

/* --- 確認フェーズ：この区間だけを出題 --- */
function buildCheck(li,si){
  const L=LINES[li],sg=stagesOf(L)[si],ids=L.st.slice(sg[0],sg[1]);
  const qs=[];
  /* 前の区間の最後の駅（2つ目以降の区間）。つながりを確認するのに使う */
  const prevSt=(!isFullStage(li,si)&&sg[0]>0)?L.st[sg[0]-1]:null;
  // 1. 並べ替え（順番に選ぶ）。前の区間があれば、その最後の駅を置いた状態から始める
  qs.push(prevSt!=null?{t:'order',ids:[prevSt].concat(ids),anchor:true,li:li}:{t:'order',ids:ids.slice(),li:li});
  // 1b. つながり：前の区間の最後の駅の次は？（必ず出す）
  let link=null;
  if(prevSt!=null&&ids.length>=3){
    const k=sg[0]-1,n=L.st.length;
    const term=L.loop?L.st[(k+4)%n]:L.st[n-1];
    link={t:'next',subject:prevSt,answer:ids[0],li:li,dirName:ST[term].ja,
      options:shuffle([ids[0]].concat(shuffle(ids.slice(1)).slice(0,3)))};
  }
  // 2. 隣の駅（各駅について）
  const inner=ids.length>2?ids.slice(0,ids.length-1):ids;
  shuffle(inner).slice(0,Math.min(4,inner.length)).forEach(g=>{
    const k=L.st.indexOf(g),dir=pick([1,-1]);let nx=k+dir;
    if(L.loop)nx=(nx+L.st.length)%L.st.length;
    if(nx<0||nx>=L.st.length)return;
    const ans=L.st[nx];
    /* 「次」は向きに依存するので、実在の駅名で方向を示す（○○方面） */
    const term=L.loop?L.st[((k+dir*4)%L.st.length+L.st.length)%L.st.length]
      :L.st[dir>0?L.st.length-1:0];
    const dis=shuffle(ids.filter(x=>x!==g&&x!==ans)).slice(0,3);
    if(dis.length<2)return;
    qs.push({t:'next',subject:g,answer:ans,options:shuffle([ans].concat(dis)),li:li,
      dirName:ST[term].ja});
  });
  // 3. この区間に含まれるか（範囲外の駅を混ぜる）
  const outside=L.st.filter(x=>ids.indexOf(x)<0);
  if(outside.length>=3){
    const inn=pick(ids);
    const dis=shuffle(outside).slice(0,3);
    qs.push({t:'member',answer:inn,options:shuffle([inn].concat(dis)),
      range:[ST[ids[0]].ja,ST[ids[ids.length-1]].ja],li:li});
  }
  // 4. 地図の穴埋め（区間の地図を見せ、１駅だけ名前を隠す）
  if(ids.length>=4){
    const blank=pick(ids);
    const dis2=shuffle(ids.filter(x=>x!==blank)).slice(0,3);
    if(dis2.length===3){
      qs.push({t:'mapfill',li:li,blank:blank,ids:ids.slice(),
        options:shuffle([blank].concat(dis2))});
    }
  }
  /* 並べ替え（qs[0]）とつながりは必ず残し、残りから6問になるまで選ぶ */
  const must=[qs[0]].concat(link?[link]:[]);
  const rest=shuffle(qs.slice(1).filter(Boolean)).slice(0,6-must.length);
  return shuffle(must.concat(rest));
}
function startCheck(li,si,inReview){
  state.t0=Date.now();
  state.check={li:li,si:si,qs:buildCheck(li,si),i:0,ok:0,ans:false,rev:!!inReview};
  render('check');
}

function buildCheckUI(q,area){
  area.innerHTML='';

    area.appendChild(el('p','q-text','地図の「？」に当てはまる駅はどれ？'));
    const marks=q.ids.map(i=>({idx:i,kind:i===q.blank?'blank':'right'}));
    const f=fitBox(withNeighbors(q.ids,q.li));
    const mapEl=buildMap({view:f.box,ar:f.ar,labels:'all',marks:marks,
      lv:Math.max(state.level,L.level),locked:true,focusLine:q.li}).wrap;
    area.appendChild(mapEl);
    area.appendChild(cap('橙の点線が「？」の駅'));
    q.options.forEach((o,n)=>{
      const b=el('button','opt');
      b.innerHTML='<span class="opt__k">'+(n+1)+'</span>'+ST[o].ja+'<span class="opt__sub">'+ST[o].ward+'</span>';
      b.onclick=()=>{
        if(state.check.ans)return;
        const l=area.querySelectorAll('.opt');
        for(let i=0;i<l.length;i++){l[i].disabled=true;const v=q.options[i];
          if(v===q.blank)l[i].classList.add('is-r');else if(v===o)l[i].classList.add('is-w')}
        finCheck(o===q.blank,o===q.blank?'正解です。':'正解は <b>'+ST[q.blank].ja+'</b> でした。',q.ids);
      };
      area.appendChild(b);
    });
    return;
  }
  if(q.t==='order'){
    area.appendChild(el('p','q-text',q.anchor
      ?'前の区間の最後「'+ST[q.ids[0]].ja+'」に続けて、この区間の駅を順にタップしてください。'
      :'この区間の駅を、'+ST[q.ids[0]].ja+' から順にタップしてください。'));
    const tray=el('div','tray'),slot=el('div','slots');
    area.appendChild(slot);area.appendChild(tray);
    let picked=q.anchor?[q.ids[0]]:[],hadMistake=false;
    const redraw=()=>{
      slot.innerHTML='';picked.forEach((g,i)=>{
        const t=el('span','tag is-ok',(i+1)+'. '+ST[g].ja);slot.appendChild(t)});
      if(!picked.length)slot.appendChild(el('span','hint','ここに順番が入ります'));
    };
    redraw();
    shuffle(q.anchor?q.ids.slice(1):q.ids.slice()).forEach(g=>{
      const b=el('button','tag',ST[g].ja);
      b.onclick=()=>{
        if(b.disabled)return;
        const want=q.ids[picked.length];
        if(g===want){
          picked.push(g);b.disabled=true;b.className='tag is-used';redraw();
          if(picked.length===q.ids.length){
            finCheck(!hadMistake,
              hadMistake
                ? '最後まで並べられましたが、途中で間違いがありました。正しい順は '
                  +q.ids.map(x=>ST[x].ja).join(' › ')+' です。'
                : '順番どおりに並べられました。',
              q.ids);
          }
        }else{
          /* 間違えても終了させず、その場でやり直せるようにする。判定は不正解として記録する */
          hadMistake=true;
          const prev=b.className;
          b.className='tag is-bad';
          setTimeout(()=>{ if(!b.disabled) b.className=prev; },450);
        }
      };
      tray.appendChild(b);
    });
    return;
  }
  if(q.t==='next'){
    area.appendChild(el('p','q-text',L.ja+'で '+ST[q.subject].ja+' から '+q.dirName+' 方面へひとつ隣の駅は？'));
  }else{
    area.appendChild(el('p','q-text','この区間（'+q.range[0]+'〜'+q.range[1]+'）に含まれるのはどれ？'));
  }
  q.options.forEach((o,n)=>{
    const b=el('button','opt');
    b.innerHTML='<span class="opt__k">'+(n+1)+'</span>'+ST[o].ja+'<span class="opt__sub">'+ST[o].ward+'</span>';
    b.onclick=()=>{
      if(state.check.ans)return;
      const l=area.querySelectorAll('.opt');
      for(let i=0;i<l.length;i++){l[i].disabled=true;const v=q.options[i];
        if(v===q.answer)l[i].classList.add('is-r');else if(v===o)l[i].classList.add('is-w')}
      const ok=o===q.answer;
      let msg='';
      if(q.t==='next'){
        const k=L.st.indexOf(q.subject);
        const around=[];for(let d2=-1;d2<=2;d2++){let j=k+d2;
          if(L.loop)j=(j+L.st.length)%L.st.length;
          if(j>=0&&j<L.st.length)around.push(ST[L.st[j]].ja)}
        msg='並びは '+around.join(' › ')+' です。';
      }else{
        msg='<b>'+ST[q.answer].ja+'</b> がこの区間の駅です。';
      }
      finCheck(ok,msg,q.t==='next'?[q.subject,q.answer]:[q.answer]);
    };
    area.appendChild(b);
  });
  const u=el('button','btn btn--gh btn--sm','わからない');u.style.marginTop='4px';
  u.onclick=()=>{
    if(state.check.ans)return;
    const l=area.querySelectorAll('.opt');
    for(let i=0;i<l.length;i++){l[i].disabled=true;if(q.options[i]===q.answer)l[i].classList.add('is-r')}
    finCheck(false,'<b>'+ST[q.answer].ja+'</b> が正解です。',
      q.t==='next'?[q.subject,q.answer]:[q.answer]);
  };
  area.appendChild(u);
}
/* 解説の地図で強調する駅（buildCheckUI が finCheck に渡すものと同じ）。ヒント地図もこれを使う */
function checkFocus(q,C){
  if(q.t==='mapfill'||q.t==='order')return q.ids.slice();
  if(q.t==='next')return[q.subject,q.answer];
  if(q.t==='member')return[q.answer];
  return stRange(C.li,C.si);
}
function finCheck(ok,msg,focus){

/* ===== 記録（Stats） ===== */
function recordAnswer(ok,ctx){
  const p=state.progress;
  p.stats=p.stats||{byLine:{},byMode:{},byStation:{},days:{},streak:0,bestStreak:0,ms:0};
  const s=p.stats;
  const day=new Date().toISOString().slice(0,10);
  s.days[day]=s.days[day]||[0,0];
  s.days[day][0]++; if(ok)s.days[day][1]++;
  if(ctx&&ctx.line!=null){
    const b=s.byLine[ctx.line]=s.byLine[ctx.line]||[0,0];
    b[0]++; if(ok)b[1]++;
  }
  if(ctx&&ctx.mode){
    const m=s.byMode[ctx.mode]=s.byMode[ctx.mode]||[0,0];
    m[0]++; if(ok)m[1]++;
  }
  if(ctx&&ctx.st!=null){
    const t=s.byStation[ctx.st]=s.byStation[ctx.st]||[0,0];
    t[0]++; if(ok)t[1]++;
    t[2]=Date.now(); t[3]=ok?1:0;   // 出題の優先度（stWeight）に使う
  }
  if(ok){s.streak++;if(s.streak>s.bestStreak)s.bestStreak=s.streak}else s.streak=0;
}

/* ===== 路線の解放と難易度バッジ ===== */
/* 解放順＝レベル→乗降客数の多い順。1路線クリアするごとに次が開く */
const LINE_ORDER=LINES.map(L=>L.i).sort((a,b)=>
  LINES[a].level-LINES[b].level || LINES[b].pax-LINES[a].pax);
const DIFF_RANK={easy:1,normal:2,hard:3};
const BADGE={
  easy:{n:'若葉',svg:'<path d="M12 21c0-5 3-8 8-8-1 5-4 8-8 8z" fill="#8CC63F"/><path d="M12 21c0-5-3-8-8-8 1 5 4 8 8 8z" fill="#F5D000"/><path d="M12 21v-3" stroke="#5A8A22" stroke-width="1.6" fill="none"/>'},
  normal:{n:'眼鏡',svg:'<circle cx="7" cy="13" r="4.2" fill="none" stroke="#2F6FB5" stroke-width="1.8"/><circle cx="17" cy="13" r="4.2" fill="none" stroke="#2F6FB5" stroke-width="1.8"/><path d="M11.2 13h1.6M2.8 12l-1-2.4M21.2 12l1-2.4" stroke="#2F6FB5" stroke-width="1.8" fill="none" stroke-linecap="round"/>'},
  hard:{n:'王冠の書',svg:'<path d="M4 9v11l8-1.4 8 1.4V9l-8 1.4z" fill="#8A5A12"/><path d="M12 10.4V19" stroke="#5E3C08" stroke-width="1.2"/><path d="M6.5 6.4l1.7 1.8L12 3.6l3.8 4.6 1.7-1.8-.5 3.2H7z" fill="#E8B923"/>'}
};
function badgeSvg(d,size){
  const s=size||18;
  return '<span class="bdg" title="'+BADGE[d].n+'"><svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'">'
    +BADGE[d].svg+'</svg></span>';
}
function lineClears(li){
  const c=(state.progress.clear||{})[li];
  return c||{};
}
function bestDiff(li){
  const c=lineClears(li);
  let b=null;
  ['easy','normal','hard'].forEach(d=>{if(c[d]&&(!b||DIFF_RANK[d]>DIFF_RANK[b]))b=d});
  return b;
}
/* 上位難易度をクリアしていれば下位もクリア扱い */
function diffCleared(li,d){
  const b=bestDiff(li);
  return b!==null && DIFF_RANK[b]>=DIFF_RANK[d];
}
/* レベル単位で解放する。同じレベルの中は好きな路線から始められる。
   そのレベルの路線の半数（切り上げ）をクリアすると、次のレベルが開く。 */
const linesOfLevel=n=>LINES.filter(L=>L.level===n).map(L=>L.i);
const needToAdvance=n=>Math.ceil(linesOfLevel(n).length/2);
function clearedInLevel(n){
  const c=state.progress.clear||{};
  return linesOfLevel(n).filter(i=>c[i]&&Object.keys(c[i]).length).length;
}
function openLevel(){
  if(state.admin)return 4;
  let lv=1;
  while(lv<4&&clearedInLevel(lv)>=needToAdvance(lv))lv++;
  return Math.max(lv,state.progress.unlocked||1);
}
function unlockedLines(){
  const top=openLevel();
  return new Set(LINES.filter(L=>L.level<=top).map(L=>L.i));
}
function ensureUnlock(){
  const p=state.progress;
  p.clear=p.clear||{};
  p.unlocked=Math.max(p.unlocked||1,openLevel());
}
/* 路線をクリアする。レベルが上がったらそのレベル番号を返す */
function clearLine(li,diff){
  const p=state.progress;
  p.clear=p.clear||{};
  const before=openLevel();
  p.clear[li]=p.clear[li]||{};
  p.clear[li][diff]=1;
  const after=openLevel();
  p.unlocked=Math.max(p.unlocked||1,after);
  return after>before?after:null;
}

/* 路線を固定した出題プール */
function poolFor(li,diff){
  const rk=DIFF[diff].r;
  return LINES[li].st.filter(i=>rk.indexOf(ST[i].rank)>=0).map(i=>ST[i]);
}
function startLineSession(li){

}

async function doLogin(isNew){
  const n=document.getElementById('acName').value.trim();

  const fail=t=>{e.textContent=t};
  if(!n)return fail('名前を入れてください。');

  const a=await getAccounts(),h=await sha(p);

  const wantAdmin=isAdminCred(n,h)&&admBox&&admBox.checked;
  state.isAdmin=isAdminCred(n,h); state.admin=wantAdmin;

    if(a[n])return fail('その名前はすでに使われています。ログインするか、別の名前にしてください。');
    a[n]={pw:h,progress:blankProgress(),level:1,diff:'normal',created:new Date().toISOString()};
    await putAccounts(a);
    state.user=n;applyAccount(a[n]);await saveNow();render(wantAdmin?'admin':'home');

    state.user=n;applyAccount(a[n]);

    render(wantAdmin?'admin':'home');

}

/* used：この回にすでに出した駅（同じ駅を続けて出さないため）
   wrong：間違えた問題（結果画面の「間違えた問題だけもう一度」用）
   fixed：出す問題が決まっているとき（やり直し）。n はこの回の問題数 */
const newSession=fixed=>({i:0,res:[],q:null,ans:false,used:new Set(),wrong:[],
  fixed:fixed||null,n:fixed?fixed.length:ROUND});
function startSession(){state.session=newSession();state.t0=Date.now();next()}
function startRetry(qs){state.session=newSession(qs.slice());state.t0=Date.now();next()}
function stopTimer(){if(state.t0){const d=Date.now()-state.t0;
  if(d<40*60000){state.progress.stats=state.progress.stats||{byLine:{},byMode:{},byStation:{},days:{},bestStreak:0,ms:0};
    state.progress.stats.ms=(state.progress.stats.ms||0)+d}
  state.t0=0}}
function next(){const s=state.session;if(s.i>=s.n){finish();return}
  let q=null,g=0;
  if(s.fixed){q=s.fixed[s.i];if(q.options)q.options=shuffle(q.options)}   // 選択肢の位置は並べ直す
  else do{q=GEN[pick(state.modes)]();g++}while(!q&&g<20);
  s.q=q;s.ans=false;render('quiz')}
function grade(ok,ex){const s=state.session;if(s.ans)return;
  s.ans=true;s.res.push(ok);state.progress.totalQ++;if(ok)state.progress.totalOK++;
  const q=s.q;
  if(!ok)s.wrong.push(q);
  let li=null,sti=null;
  if(q.line!=null)li=q.line;
  else if(q.mode==='route'&&q.r&&q.r.legs.length)li=q.r.legs[0].line;
  else{const t=(q.target!=null?q.target:(q.subject!=null?q.subject:(q.station!=null?q.station:q.answer)));
    if(typeof t==='number'&&ST[t]&&ST[t].lines.length)li=ST[t].lines[0]}
  /* 経路問題の answer は路線番号なので、駅としては出発駅を記録する */
  const t2=q.mode==='route'?q.from
    :(q.target!=null?q.target:(q.subject!=null?q.subject:(q.station!=null?q.station:q.answer)));
  if(typeof t2==='number'&&ST[t2])sti=t2;
  if(sti!=null&&s.used)s.used.add(sti);
  recordAnswer(ok,{line:li,mode:q.mode,st:sti});
  touch();fb(ok,ex||{})}
async function finish(){const s=state.session,ok=s.res.filter(Boolean).length,pct=Math.round(ok/s.n*100);
  /* やり直し（間違えた問題だけ）は、クリアや最高記録には数えない */
  if(s.fixed){stopTimer();touch();state.session=null;
    render('result',{ok:ok,n:s.n,pct:pct,li:state.quizLine,diff:state.diff,retry:true,wrong:s.wrong});return}
  if(pct>(state.progress.best[state.level]||0))state.progress.best[state.level]=pct;
  let newly=null,li=state.quizLine;
  /* レベルが開くのは clearLine の中だけ（そのレベルの路線の半数をクリアしたとき）。
     以前はここで1回50%を取るだけで次のレベルを開けていた */
  if(pct>=50&&li!=null)newly=clearLine(li,state.diff);
  stopTimer();touch();
  state.session=null; // 終わったクイズを「進行中」のまま残さない
  render('result',{ok:ok,n:s.n,pct:pct,li:li,diff:state.diff,newly:newly,mix:state.mixMode,wrong:s.wrong})}
function abort(){stopTimer();state.session=null;render('home')}

const unkBtn=fn=>{const b=el('button','btn btn--gh btn--sm','わからない（答えを見る）');
  b.style.marginTop='4px';b.onclick=fn;return b};
function optLabel(q,v){
  if(q.optType==='line')return[lineTag(v,20),''];
  if(q.optType==='ward')return[v,''];
  if(q.optType==='text')return[v,''];
  return[ST[v].ja,'<span class="opt__sub">'+ST[v].ward+'</span>'];
}
function buildAns(q,area){
  area.innerHTML='';
  if(q.mode==='map'){
    const m=buildMap({interactive:true,legend:true,maxVh:60,labels:'none',onTap:(i,g)=>{
      if(state.session.ans)return;
      const ok=i===q.target;
      m.groups[q.target].setAttribute('class','st-g is-r');
      if(!ok)g.setAttribute('class','st-g is-w');
      const u=area.querySelector('.btn--sm');if(u)u.remove();
      grade(ok,{picked:i})}});
    area.appendChild(m.wrap);area.appendChild(cap('丸の大きさ＝乗降客数'));
    area.appendChild(unkBtn(()=>{if(state.session.ans)return;
      m.groups[q.target].setAttribute('class','st-g is-r');
      const u=area.querySelector('.btn--sm');if(u)u.remove();grade(false,{unknown:1})}));
    return;
  }
  const correct=(q.optType==='text')?q.answerText:(q.optType==='ward'?q.answer:q.answer);
  q.options.forEach((o,n)=>{
    const b=el('button','opt'),L=optLabel(q,o);
    b.innerHTML='<span class="opt__k">'+(n+1)+'</span>'+L[0]+L[1];
    b.onclick=()=>{if(state.session.ans)return;reveal(area,q,correct,o);grade(o===correct,{picked:o})};
    area.appendChild(b)});
  area.appendChild(unkBtn(()=>{if(state.session.ans)return;reveal(area,q,correct,null);grade(false,{unknown:1})}));
}
function reveal(area,q,correct,picked){
  const l=area.querySelectorAll('.opt');
  for(let i=0;i<l.length;i++){l[i].disabled=true;const v=q.options[i];
    if(v===correct)l[i].classList.add('is-r');
    else if(picked!==null&&v===picked)l[i].classList.add('is-w')}
  const u=area.querySelector('.btn--sm');if(u)u.remove();
}

function fb(ok,ex){
  const q=state.session.q,card=el('div','card');
  card.appendChild(el('div','verdict '+(ok?'ok':'ng'),ex.unknown?'答えあわせ':(ok?'正解':'不正解')));
  const body=el('div','explain');let focus=[],marks=[],why='',legs=null,fline=null,hlWard=null;
  const chip=l=>lineChip(l);

  if(q.mode==='map'){
    const t=ST[q.target];
    body.innerHTML='<b>'+t.ja+'</b>（'+t.ward+'・'+fmtPax(t.pax)+'／日）<br>'
      +t.lines.map(chip).join('')+(t.spots.length?'<br>周辺：'+t.spots.map(x=>x[0]).join('、'):'');
    focus=[q.target];marks=[{idx:q.target,kind:'right'}];
    if(ex.picked!=null&&ex.picked!==q.target){
      const p=ST[ex.picked];focus.push(ex.picked);marks.push({idx:ex.picked,kind:'wrong'});
      const r=route(q.target,ex.picked,activeLines());
      why=row('w',p.ja,'こちらは'+p.ward+'。'+t.ja+'から'+(r?r.hops+'駅離れています':'別方面です'));
    }
  }
  else if(q.mode==='route'){
    const r=q.r;
    body.appendChild(el('div',null,'<b>'+ST[q.from].ja+'</b> から <b>'+ST[q.to].ja
      +'</b>　計'+r.hops+'駅・乗換'+r.transfers+'回'));
    body.appendChild(routeView(r));
    const p=el('p','hint');p.style.marginTop='8px';
    p.innerHTML='このゲームでは「乗換が少ない→次に駅数が少ない」順で最適ルートを計算しています。';
    body.appendChild(p);
    focus=[q.from,q.to];marks=[{idx:q.from,kind:'right'},{idx:q.to,kind:'right'}];
    r.legs.forEach(g=>{if(focus.indexOf(g.from)<0){focus.push(g.from);marks.push({idx:g.from,kind:'right'})}});
    legs=r.legs;fline=r.legs[0].line;
    why=q.options.filter(o=>o!==q.answer).map(o=>{
      const alt=ST[q.from].lines.indexOf(o)>=0;
      return row('w',LINES[o].ja, alt?(ST[q.from].ja+'に乗り入れていますが、この経路では遠回りになります')
        :(ST[q.from].ja+'は通っていません（'+ST[LINES[o].st[0]].ja+'方面の路線）'));
    }).join('');
  }
  else if(q.mode==='spot'){
    if(q.dir==='toSpot'){
      const s=ST[q.station];
      body.innerHTML='<div class="spot-hero"><span class="ic">'+icon(q.icon)+'</span><div><h4>'
        +q.answerText+'</h4><p>'+s.ja+'駅（'+s.ward+'）</p></div></div>'+s.lines.map(chip).join('');
      focus=[q.station];marks=[{idx:q.station,kind:'right'}];
      why=q.options.filter(o=>o!==q.answerText).map(o=>{const f=SPOT_IX[o];if(!f)return '';
        focus.push(f.st);marks.push({idx:f.st,kind:'wrong'});
        return row('w',o,'こちらは'+ST[f.st].ja+'駅の近く（'+ST[f.st].ward+'）',f.ic)}).join('');
    }else{
      const s=ST[q.answer];
      body.innerHTML='<div class="spot-hero"><span class="ic">'+icon(q.icon)+'</span><div><h4>'
        +q.spotText+'</h4><p>最寄りは '+s.ja+'駅（'+s.ward+'）</p></div></div>'+s.lines.map(chip).join('');
      focus=[q.answer];marks=[{idx:q.answer,kind:'right'}];
      why=q.options.filter(o=>o!==q.answer).map(o=>{focus.push(o);marks.push({idx:o,kind:'wrong'});
        const t=ST[o],r=route(q.answer,o,activeLines());
        return row('w',t.ja,(t.spots.length?'周辺は'+t.spots.map(x=>x[0]).join('、')+'。':'')
          +(r?s.ja+'から'+r.hops+'駅':''),t.spots[0]?t.spots[0][1]:null)}).join('');
    }
  }
  else{
    if(q.kind==='line'){
      const s=ST[q.subject];
      body.innerHTML='<b>'+s.ja+'</b>（'+s.ward+'）を通るのは<br>'+s.lines.map(chip).join('');
      focus=[q.subject];marks=[{idx:q.subject,kind:'right'}];
      why=q.options.filter(o=>o!==q.answer).map(o=>{
        const L=LINES[o],e=L.st[0],f=L.st[L.st.length-1];
        return row('w',L.ja,e!==undefined?ST[e].ja+'〜'+ST[f].ja+'の路線で、'+s.ja+'は通りません':'')}).join('');
    }else if(q.kind==='ward'){
      hlWard=q.answer;
      const s=ST[q.subject];
      body.innerHTML='<b>'+s.ja+'</b>駅は<b>'+s.ward+'</b>にあります。'+
        '<br>'+s.lines.map(chip).join('');
      focus=[q.subject];marks=[{idx:q.subject,kind:'right'}];
      why=q.options.filter(o=>o!==q.answer).map(o=>{
        const ex2=ST.filter(x=>x.ward===o&&x.level<=state.level).sort((a,b)=>b.pax-a.pax).slice(0,3);
        return row('w',o,ex2.length?'この区の主な駅は'+ex2.map(x=>x.ja).join('、'):'')}).join('');
    }else if(q.kind==='next'){
      fline=q.line;
      const s=ST[q.subject],a=ST[q.answer],L=LINES[q.line];
      const k=L.st.indexOf(q.subject);
      const seq=[];for(let d=-2;d<=2;d++){let j=k+d;
        if(L.loop)j=(j+L.st.length)%L.st.length;
        if(j>=0&&j<L.st.length)seq.push(ST[L.st[j]].ja)}
      body.innerHTML='<b>'+a.ja+'</b>（'+a.ward+'）<br>'+chip(q.line)+'の並び：'+seq.join(' › ');
      focus=[q.subject,q.answer];marks=[{idx:q.subject,kind:'right'},{idx:q.answer,kind:'right'}];
      why=q.options.filter(o=>o!==q.answer).map(o=>{
        const j=L.st.indexOf(o),d=Math.abs(j-k);
        focus.push(o);marks.push({idx:o,kind:'wrong'});
        return row('w',ST[o].ja,j>=0?(s.ja+'から'+L.ja+'で'+Math.min(d,L.st.length-d)+'駅離れています'):'この路線上にありません')}).join('');
    }else{
      const b=ST[q.subject],a=ST[q.answer];
      const hm={};q.hops.forEach(h=>hm[h.x]=h.h);
      body.innerHTML='<b>'+a.ja+'</b>が最短で、'+b.ja+'から<b>'+hm[q.answer]+'駅</b>です。';
      focus=[q.subject,q.answer];marks=[{idx:q.subject,kind:'right'},{idx:q.answer,kind:'right'}];
      why=q.options.filter(o=>o!==q.answer).map(o=>{focus.push(o);marks.push({idx:o,kind:'wrong'});
        return row('w',ST[o].ja,hm[o]>=90?'この路線範囲では行けません':(hm[o]+'駅で、'+a.ja+'より'+(hm[o]-hm[q.answer])+'駅ぶん遠いです'))}).join('');
    }
  }
  card.appendChild(body);
  if(why)card.appendChild(el('div','why','<h5>選択肢のふりかえり</h5>'+why));
  const mb=el('div');mb.style.marginTop='15px';
  mb.appendChild(el('div','eyebrow','位置を確認'));
  const uq=[];focus.forEach(f=>{if(uq.indexOf(f)<0)uq.push(f)});
  mb.appendChild(miniMap(uq,marks,legs,fline,hlWard));
  mb.appendChild(cap(hlWard?('白抜きが今回の駅／緑の範囲が'+hlWard):'白抜きが今回の問題の駅／前後1駅まで表示'));
  card.appendChild(mb);
  const btn=el('button','btn',state.session.i+1>=state.session.n?'結果を見る':'次の問題へ');
  btn.onclick=()=>{state.session.i++;next()};card.appendChild(btn);
  const ab=el('button','btn btn--gh btn--sm','中断してホームに戻る');
  ab.style.marginTop='8px';ab.onclick=abort;card.appendChild(ab);
  $('#screen').appendChild(card);card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

}

/* 画面内の確認ダイアログ。ブラウザ標準の confirm() は、アプリ内ブラウザなど
   環境によって表示されずに常にキャンセル扱いになり、画面を移動できなくなるため使わない */
function askConfirm(msg, okLabel){
  return new Promise(resolve=>{
    const ov = el('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(10,18,24,.55);'
      + 'display:flex;align-items:center;justify-content:center;padding:16px';
    const box = el('div','card');
    /* .card のふわっと出る動きは付けない（途中で止まると箱が半透明のまま読みにくいため） */
    box.style.cssText = 'max-width:360px;width:100%;margin:0;animation:none';
    box.appendChild(el('p',null,msg));
    const yes = el('button','btn',okLabel||'はい');
    const no = el('button','btn btn--gh','キャンセル'); no.style.marginTop='10px';
    const close = v=>{ ov.remove(); resolve(v); };
    yes.onclick = ()=>close(true);
    no.onclick = ()=>close(false);
    ov.onclick = e=>{ if(e.target===ov) close(false); };
    box.appendChild(yes); box.appendChild(no); ov.appendChild(box);
    document.body.appendChild(ov);
  });
}

/* ============================================================
   東京地理マスター（23区）
   ============================================================ */
/* 23区の隣接関係。国土数値情報のような一次データではなく、
   一般的な地理知識にもとづく手作りのリストです。お台場付近の
   港区・江東区のように水面をはさむ「際どい」境界は含めていますが、
   ごく短い接点（例: 世田谷区と中野区の一角）は誤りの余地がある
   ため、断定はしていません。 */
const WARD_ADJ = {
  '千代田':['中央','港','新宿','文京','台東'],
  '中央':['千代田','港','台東','江東'],
  '港':['千代田','中央','新宿','渋谷','品川','江東'],
  '新宿':['千代田','港','渋谷','中野','豊島','文京'],
  '文京':['千代田','新宿','豊島','北','台東'],
  '台東':['千代田','中央','文京','荒川','墨田'],
  '墨田':['台東','荒川','葛飾','江戸川','江東','足立'],
  '江東':['中央','港','墨田','江戸川'],
  '品川':['港','目黒','大田'],
  '目黒':['品川','大田','世田谷','渋谷'],
  '大田':['品川','目黒','世田谷'],
  '世田谷':['目黒','大田','渋谷','杉並'],
  '渋谷':['新宿','港','目黒','世田谷','中野','杉並'],
  '中野':['新宿','杉並','練馬','豊島','渋谷'],
  '杉並':['中野','練馬','世田谷','渋谷'],
  '豊島':['新宿','文京','北','板橋','練馬','中野'],
  '北':['文京','荒川','足立','板橋','豊島'],
  '荒川':['台東','北','足立','墨田'],
  '板橋':['豊島','北','練馬'],
  '練馬':['板橋','豊島','中野','杉並'],
  '足立':['北','荒川','葛飾','墨田'],
  '葛飾':['足立','墨田','江戸川'],
  '江戸川':['葛飾','墨田','江東']
};
const WARD_NAMES = Object.keys(WARDS).map(k=>k.replace(/区$/,''));

/* 区の見た目上のサイズ（画面上の外接矩形）に応じてラベルの文字サイズを決める。
   小さい区(中央区・台東区など)が隣の区の文字とぶつからないように、
   大きい区(足立区・世田谷区など)ほど大きく表示する。 */
/* bare は「区」を含まない名前（例:'千代田'）で統一して受け取る */
function wardBounds(bare){
  const rings = WARDS[bare+'区'][0];
  const xs = rings.map(c=>px(c[0])), ys = rings.map(c=>py(c[1]));
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  const y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  return {cx:(x0+x1)/2, cy:(y0+y1)/2, w:x1-x0, h:y1-y0};
}
function wardFontSize(bare){
  const b = wardBounds(bare);
  return Math.max(10, Math.min(17, Math.min(b.w,b.h)*0.34));
}

/* 23区の地図。2つの役割を厳密に分ける：
   - mode:'browse'（既定）… タップすると区名が出るだけ。採点には一切関わらない「閲覧用」の地図。
   - mode:'answer'         … 区名は出さず、タップした区がそのまま解答になる。「解答用」の地図。
   どちらも render() は一切呼ばない（呼ぶと画面がスクロール位置ごと再構築され、
   タップのたびに画面が動いたり、答えた直後の表示が消えたりする原因になるため）。 */
function buildWardMap(o){
  o = Object.assign({revealed:null,interactive:true,onTap:null,marks:[],mode:'browse'}, o||{});
  const wrap = el('div','map-wrap geo-map');
  const view = FULL;
  const svg = sv('svg',{viewBox:view.join(' '),preserveAspectRatio:'xMidYMid meet'});
  PREF.forEach(p=>svg.appendChild(tx(px(p[2]),py(p[1]),'lbl--pref',p[0])));
  svg.appendChild(sv('polygon',{points:enc(SEA.map(q=>[q[1],q[0]])),fill:'var(--sea)'}));
  svg.appendChild(tx(px(139.885),py(35.560),'lbl--geo','東 京 湾'));
  const markOf = k => o.marks.find(m=>m.key===k);
  const drawn = {};
  let wi=0;
  for(const k in WARDS){
    const bare = k.replace(/区$/,'');
    const mk = markOf(bare);
    const f = mk ? (mk.kind==='right'?'#4FA85A':(mk.kind==='wrong'?'#D5555A':WARD_FILL[wi%WARD_FILL.length])) : WARD_FILL[wi%WARD_FILL.length];
    wi++;
    WARDS[k].forEach(r=>{
      const pg = sv('polygon',{points:enc(r),fill:f,stroke:mk?'var(--yamanote)':'var(--wardline)',
        'stroke-width':mk?2.2:1.1,'stroke-linejoin':'round'});
      if(o.interactive){
        pg.style.cursor='pointer';
        pg.setAttribute('data-ward',bare);
      }
      svg.appendChild(pg);
    });
  }
  /* bare（「区」を含まない名前）で統一して扱う */
  function drawLabel(bare){
    if(drawn[bare]) return;
    drawn[bare] = true;
    const b = wardBounds(bare);
    const t = tx(b.cx, b.cy, 'geo-wardname', bare+'区');
    t.setAttribute('font-size', wardFontSize(bare).toFixed(1)+'px');
    svg.appendChild(t);
  }
  for(const k in WARDS){
    const bare = k.replace(/区$/,'');
    if(o.mode==='browse' && o.revealed && o.revealed.has(bare)) drawLabel(bare);
    if(o.mode==='reveal') drawLabel(bare); // 解説用：全区名を最初から表示
  }
  wrap.appendChild(svg);
  if(o.interactive){
    svg.addEventListener('click', e=>{
      const t = e.target.getAttribute && e.target.getAttribute('data-ward');
      if(!t) return;
      if(o.mode==='browse'){
        if(o.revealed) o.revealed.add(t);
        drawLabel(t);              // ← DOMに直接追加するだけ。render()は呼ばない
      } else if(o.mode==='answer'){
        if(o.onTap) o.onTap(t);    // 解答用は名前を出さず、コールバックにまかせる
      }
    });
  }
  return {wrap:wrap, svg:svg};
}

/* ---------- クイズ本体 ---------- */
const GEO_ROUND = 10;
function genGeoQ(){
  const kind = pick(['where','adj']);
  if(kind==='where'){
    const target = pick(WARD_NAMES);
    return {t:'where', target:target, text: target+'区はどこ？　地図から選んでください。'};
  }
  const target = pick(WARD_NAMES);
  const adj = WARD_ADJ[target]||[];
  if(!adj.length) return genGeoQ();
  const answer = pick(adj);
  const notAdj = shuffle(WARD_NAMES.filter(w=>w!==target && adj.indexOf(w)<0)).slice(0,3);
  if(notAdj.length<3) return genGeoQ();
  return {t:'adj', target:target, answer:answer,
    options:shuffle([answer].concat(notAdj)),
    text: target+'区に隣接するのは？'};
}
function startGeoSession(){
  state.geo = {i:0, res:[], q:null, ans:false, revealed:new Set()};
  nextGeoQ();
}
function nextGeoQ(){
  const G = state.geo;
  if(G.i>=GEO_ROUND){ finishGeo(); return; }
  G.q = genGeoQ(); G.ans=false; G.revealed=new Set();
  render('geoQuiz');
}
function finishGeo(){
  const G = state.geo, ok = G.res.filter(Boolean).length;
  render('geoResult', {ok:ok, pct:Math.round(ok/GEO_ROUND*100)});
}
function gradeGeo(ok, extra){
  const G = state.geo;
  if(G.ans) return;
  G.ans = true; G.res.push(ok);
  geoFeedback(ok, extra||{});
}
function screenGeoQuiz(){
  const G = state.geo, q = G.q, w = el('div');
  const pr = el('div','prog'), bs = el('div','prog__b');
  for(let i=0;i<GEO_ROUND;i++) bs.appendChild(el('i', i<G.res.length ? (G.res[i]?'ok':'ng') : (i===G.i?'now':'')));
  pr.appendChild(bs);
  const ab = el('button', null, 'やめる');
  ab.onclick=()=>render('geoTokyo');
  pr.appendChild(ab);
  w.appendChild(pr);

  /* 閲覧用の地図：区名の確認だけが目的で、問題の種類に関係なく必ず表示する。
     タップしても採点には一切影響しない。 */
  const browseMap = buildWardMap({revealed:G.revealed, interactive:true, mode:'browse'});
  w.appendChild(browseMap.wrap);
  w.appendChild(cap('区をタップすると名前が表示されます（次の問題で再び隠れます）／この地図は確認用で、解答には使いません'));

  w.appendChild(el('p','q-text',q.text));

  if(q.t==='where'){
    /* 解答は別の地図で行う：こちらは名前を出さない */
    w.appendChild(el('p','hint','下の地図をタップして解答してください。'));
    const answerMap = buildWardMap({interactive:true, mode:'answer', onTap:(wardName)=>{
      if(G.ans) return;
      gradeGeo(wardName===q.target, {picked:wardName});
    }});
    w.appendChild(answerMap.wrap);
  }
  if(q.t==='adj'){
    q.options.forEach((o,n)=>{
      const b = el('button','opt');
      b.innerHTML = '<span class="opt__k">'+(n+1)+'</span>'+o+'区';
      b.onclick=()=>{
        if(G.ans) return;
        const l = w.querySelectorAll('.opt');
        for(let i=0;i<l.length;i++){ l[i].disabled=true;
          if(q.options[i]===q.answer) l[i].classList.add('is-r');
          else if(q.options[i]===o) l[i].classList.add('is-w'); }
        gradeGeo(o===q.answer, {picked:o});
      };
      w.appendChild(b);
    });
  }
  return w;
}
function geoFeedback(ok, ex){
  const G = state.geo, q = G.q;
  const card = el('div','card');
  card.appendChild(el('div','verdict '+(ok?'ok':'ng'), ok?'正解':'不正解'));
  const body = el('div','explain');
  const marks = [];
  if(q.t==='where'){
    marks.push({key:q.target, kind:'right'});
    if(ex.picked && ex.picked!==q.target) marks.push({key:ex.picked, kind:'wrong'});
    body.innerHTML = '<b>'+q.target+'区</b>の位置はここです。'
      + (ex.picked && ex.picked!==q.target ? 'タップしたのは <b>'+ex.picked+'区</b> でした。' : '');
  } else {
    marks.push({key:q.target, kind:'right'}); marks.push({key:q.answer, kind:'right'});
    body.innerHTML = '<b>'+q.target+'区</b>に隣接するのは '
      + (WARD_ADJ[q.target]||[]).map(x=>x+'区').join('、') + ' です。';
  }
  card.appendChild(body);
  const mb = el('div'); mb.style.marginTop='14px';
  mb.appendChild(el('div','eyebrow','位置を確認'));
  mb.appendChild(buildWardMap({mode:'reveal', interactive:false, marks:marks}).wrap);
  card.appendChild(mb);
  const btn = el('button','btn', G.i+1>=GEO_ROUND ? '結果を見る' : '次の問題へ');
  btn.onclick=()=>{ G.i++; nextGeoQ(); };
  card.appendChild(btn);
  $('#screen').appendChild(card);
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

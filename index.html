/* ============================================================
   全国地理マスター — 47都道府県
   出典：国土数値情報（行政区域）を利用者がmapshaperで都道府県単位に
   融合・簡略化（許容誤差700m）したもの。北海道の北方四島、
   東京都の南方の離島は、データとしては保持しつつ、初期の地図表示
   範囲の計算からは除外している（沖縄本島・八重山諸島は含む）。
   隣接関係は、簡略化後のポリゴン同士の最短距離が3km未満かどうかで
   機械的に判定した（23区版のような手作りリストではない）。 */
/* 北海道だけ「道」が地名そのものの一部で、他県のような取り外し可能な接尾辞ではない */
function stripSuffix(full){ return full==='北海道' ? full : full.replace(/[都道府県]$/,''); }
const PREF_NAMES = Object.keys(PREF_PACKED).map(stripSuffix);
const PREF_SUFFIX = {}; for(const k in PREF_PACKED) PREF_SUFFIX[stripSuffix(k)] = (k==='北海道'?'':k.slice(-1));
function prefFull(bare){ return bare==='北海道' ? bare : bare + (PREF_SUFFIX[bare]||'県'); }

const KP = Math.cos(36.0*Math.PI/180), PORG={lat:38.5,lon:135.5}, PSC=2600;
const ppx = lo => (lo-PORG.lon)*KP*PSC, ppy = la => (PORG.lat-la)*PSC;
const PGEOM = {}; // 都道府県名(フル)→[[ [lon,lat], ... ], ...]
for(const k in PREF_PACKED) PGEOM[k] = PREF_PACKED[k].map(decPath);

/* 初期表示範囲：北方四島・東京都南方の離島だけは枠の計算から外す */
function isFrameOutlier(fullName, ring){
  let maxLon=-999, minLat=999;
  ring.forEach(c=>{ if(c[0]>maxLon)maxLon=c[0]; if(c[1]<minLat)minLat=c[1]; });
  if(fullName==='北海道' && ring.every(c=>c[0]>146.5)) return true;
  if(fullName==='東京都' && ring.every(c=>c[1]<26.0)) return true;
  return false;
}
const PFULL = (()=>{
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const k in PGEOM) PGEOM[k].forEach(r=>{
    if(isFrameOutlier(k,r)) return;
    r.forEach(c=>{const x=ppx(c[0]),y=ppy(c[1]);
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;});
  });
  const padX=(x1-x0)*0.05, padY=(y1-y0)*0.05;
  return [x0-padX, y0-padY, (x1-x0)+padX*2, (y1-y0)+padY*2];
})();
/* 面積の重心（シューレース公式）。凹んだ形や飛び地の多い県でも
   その輪の内側に収まりやすい。ラベルは「一番大きい島（リング）」だけを
   見て置く（諸島全体のbboxだと、島と島の間の海に落ちてしまうため）。 */
function ringArea(r){
  let a=0; for(let i=0;i<r.length-1;i++) a += r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];
  return a/2;
}
function ringCentroid(r){
  let A=0,cx=0,cy=0;
  for(let i=0;i<r.length-1;i++){
    const x0=r[i][0],y0=r[i][1],x1=r[i+1][0],y1=r[i+1][1],cr=x0*y1-x1*y0;
    A+=cr; cx+=(x0+x1)*cr; cy+=(y0+y1)*cr;
  }
  A/=2;
  if(Math.abs(A)<1e-9){
    const xs=r.map(p=>p[0]),ys=r.map(p=>p[1]);
    return [xs.reduce((a,b)=>a+b,0)/xs.length, ys.reduce((a,b)=>a+b,0)/ys.length];
  }
  return [cx/(6*A), cy/(6*A)];
}
function mainRing(fullName){
  const rings = PGEOM[fullName];
  return rings.reduce((best,r)=>Math.abs(ringArea(r))>Math.abs(ringArea(best))?r:best, rings[0]);
}
function inRing(pt, r){
  let c=false; const n=r.length;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];
    if(((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
/* 面積重心が入り江の外（V字・三日月形の県）に落ちることがあるので、
   その場合は頂点の単純平均、それでもだめなら重心に一番近い頂点、の順に試す */
function safeCentroid(r){
  const a = ringCentroid(r);
  if(inRing(a, r)) return a;
  const xs=r.map(p=>p[0]), ys=r.map(p=>p[1]);
  const b = [xs.reduce((s,v)=>s+v,0)/xs.length, ys.reduce((s,v)=>s+v,0)/ys.length];
  if(inRing(b, r)) return b;
  let best=r[0], bd=1e18;
  r.forEach(p=>{const d=(p[0]-a[0])**2+(p[1]-a[1])**2; if(d<bd){bd=d; best=p;}});
  /* 海岸線ぎりぎりの頂点そのものだと不自然なので、面積重心の方へ少し引き寄せる */
  const nudged = [(best[0]*0.4+a[0]*0.6), (best[1]*0.4+a[1]*0.6)];
  return inRing(nudged, r) ? nudged : best;
}
function bboxOf(pts){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  const y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  return {x0,x1,y0,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};
}
/* 内陸8県は、他県の隣接に囲まれて境界が入り組みやすいので、
   ここだけ「収まりやすさ」を優先した特別扱いにする（下のPLABELで使う） */
const LANDLOCKED = ['埼玉','群馬','栃木','山梨','長野','岐阜','滋賀','奈良'];

function textBoxUnits(name, fontSizeUnits){
  return {w: fontSizeUnits*name.length*0.98, h: fontSizeUnits*1.2};
}
function containFrac(ring, cx, cy, w, h){
  const cols=6, rows=4; let hit=0;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const px2 = cx - w/2 + w*(i+0.5)/cols;
    const py2 = cy - h/2 + h*(j+0.5)/rows;
    if(inRing([px2,py2], ring)) hit++;
  }
  return hit/(cols*rows);
}
function boxesOverlap(a,b){
  return !(a.x1<b.x0 || b.x1<a.x0 || a.y1<b.y0 || b.y1<a.y0);
}
/* 全国地図はviewBoxの座標単位が非常に大きい（路線図とは桁が違う）ので、
   fontSizeもその大きさに合わせて拡大しないと画面上では点にしかならない。
   PFULL[2]（初期の全体幅）を基準に、実際の画面px相当に換算する。 */
const PSCALE = PFULL[2] / 380;

/* 47都道府県ぶんのラベル配置（位置・文字サイズ）を、読み込み時に一度だけ計算する。
   ・海に面する都道府県：外接する四角形の中心に、四角形の短辺の30%のサイズで置く
   （複雑な海岸線にきっちり収めようとすると文字が小さくなりすぎるため、
   　ここは「他県とかぶらないように」という制約は課さない）。
   ・内陸8県：文字の75%が県内に収まり、かつ他県の文字と重ならない範囲で、
   　できるだけ大きく表示する（binary searchで最大サイズを探す）。 */
const MIN_LABEL_PX = 5;               // どの県も最低これだけの画面pxは確保する
const MIN_LABEL_UNITS = MIN_LABEL_PX * PSCALE;

const PLABEL = (()=>{
  const plan = {}; const placedBoxes = [];
  const names = Object.keys(PGEOM).map(stripSuffix);

  // 先に沿岸県（単純ルール）を確定させる。位置はどの県も重心に統一する。
  names.filter(n=>LANDLOCKED.indexOf(n)<0).forEach(bare=>{
    const full = prefFull(bare), r = mainRing(full);
    const rp = r.map(pt=>[ppx(pt[0]),ppy(pt[1])]);
    const c = safeCentroid(r), cx = ppx(c[0]), cy = ppy(c[1]);
    const rb = bboxOf(rp);
    /* 「サイズは外接する四角形の30%」＝文字の高さ（フォントサイズ）を
       四角形の短辺の30%にする。最低でも画面上MIN_LABEL_PXは確保する。 */
    const size = Math.max(Math.min(rb.w, rb.h) * 0.30, MIN_LABEL_UNITS);
    const tb = textBoxUnits(bare, size);
    plan[bare] = {cx, cy, size};
    placedBoxes.push({x0:cx-tb.w/2,x1:cx+tb.w/2,y0:cy-tb.h/2,y1:cy+tb.h/2});
  });

  // 内陸8県：75%内包 かつ 他ラベルと非重複、を満たす最大サイズを探す（最低保証つき）
  //（当たり判定は必ず投影後（ppx/ppy）の座標系で統一する）
  names.filter(n=>LANDLOCKED.indexOf(n)>=0).forEach(bare=>{
    const full = prefFull(bare), r = mainRing(full);
    const rp = r.map(pt=>[ppx(pt[0]),ppy(pt[1])]);
    const c = safeCentroid(r);
    const cx = ppx(c[0]), cy = ppy(c[1]);
    const rb = bboxOf(rp);
    let lo=2, hi=Math.max(lo+1, rb.w/(bare.length*0.5)); // 探索の上限は県自体の横幅相当
    let best=lo;
    for(let iter=0; iter<22; iter++){
      const mid=(lo+hi)/2;
      const tb = textBoxUnits(bare, mid);
      const box = {x0:cx-tb.w/2,x1:cx+tb.w/2,y0:cy-tb.h/2,y1:cy+tb.h/2};
      const frac = containFrac(rp, cx, cy, tb.w, tb.h);
      const overlap = placedBoxes.some(pb=>boxesOverlap(pb, box));
      if(frac>=0.75 && !overlap){ best=mid; lo=mid; } else { hi=mid; }
    }
    best = Math.max(best, MIN_LABEL_UNITS);
    const tb = textBoxUnits(bare, best);
    plan[bare] = {cx, cy, size:best};
    placedBoxes.push({x0:cx-tb.w/2,x1:cx+tb.w/2,y0:cy-tb.h/2,y1:cy+tb.h/2});
  });
  return plan;
})();

/* 地図に描くデータ一式。o.data で差し替えると、同じ地図の仕組みで
   旧国名（KUNI_MAPDATA）も描ける。省略時は47都道府県。
   geom：フル名→リング配列／key：フル名→表示名／full：表示名→フル名 */
const PREF_MAPDATA = {geom:PGEOM, key:stripSuffix, full:prefFull, label:PLABEL, frame:PFULL,
  fill:full=>PREF_FILL[full], main:mainRing};

/* 47都道府県の地図。23区版のbuildWardMapと同じ「browse / answer / reveal」の
   3モードを持つ。役割の分離もそのまま踏襲している。 */
function buildPrefMap(o){
  o = Object.assign({revealed:null,interactive:true,onTap:null,marks:[],mode:'browse',locked:true}, o||{});
  const D = o.data || PREF_MAPDATA;
  let locked = !!o.locked;
  const wrap = el('div','map-wrap geo-map');
  const setTouch = () => { wrap.style.touchAction = locked ? 'auto' : 'none'; };
  setTouch();
  let vb = D.frame.slice();
  const AR_P = D.frame[3]/D.frame[2];
  const svg = sv('svg',{viewBox:vb.join(' '),preserveAspectRatio:'xMidYMid meet'});
  const markOf = k => o.marks.find(m=>m.key===k);
  const drawn = {};
  for(const full in D.geom){
    const bare = D.key(full);
    const mk = markOf(bare);
    const f = mk ? (mk.kind==='right'?'#4FA85A':(mk.kind==='wrong'?'#D5555A':D.fill(full))) : D.fill(full);
    D.geom[full].forEach(r=>{
      const pg = sv('polygon',{points:r.map(c=>ppx(c[0]).toFixed(1)+','+ppy(c[1]).toFixed(1)).join(' '),
        fill:f, stroke:mk?'var(--yamanote)':'var(--wardline)', 'stroke-width':mk?2.0:0.9,'stroke-linejoin':'round'});
      if(o.interactive){ pg.style.cursor='pointer'; pg.setAttribute('data-pref',bare); pg.setAttribute('data-tap','1'); }
      svg.appendChild(pg);
    });
  }
  /* 答えの県を半透明の赤い丸で囲む。ラベルより先（背面）に描き、
     文字はその上に重ねて描くことで、名前自体は隠れず読める */
  if(o.arrow && D.label[o.arrow]){
    const p = D.label[o.arrow];
    const rb = bboxOf(D.main(D.full(o.arrow)).map(pt=>[ppx(pt[0]),ppy(pt[1])]));
    const rr = Math.max(rb.w, rb.h) * 0.62;
    svg.appendChild(sv('circle',{cx:p.cx, cy:p.cy, r:rr.toFixed(1),
      fill:'#E8384A', 'fill-opacity':'0.38', stroke:'#E8384A', 'stroke-width':(rr*0.05).toFixed(2), 'stroke-opacity':'0.7'}));
  }
  function drawLabel(bare){
    if(drawn[bare]) return; drawn[bare]=true;
    const p = D.label[bare];
    const t = tx(p.cx, p.cy, 'geo-wardname', bare);
    t.setAttribute('font-size', p.size.toFixed(1)+'px');
    svg.appendChild(t);
  }
  for(const full in D.geom){
    const bare = D.key(full);
    if(o.mode==='browse' && o.revealed && o.revealed.has(bare)) drawLabel(bare);
    if(o.mode==='reveal') drawLabel(bare);
  }
  wrap.appendChild(svg);

  function handleTap(bare){
    if(o.mode==='browse'){ if(o.revealed) o.revealed.add(bare); drawLabel(bare); }
    else if(o.mode==='answer'){ if(o.onTap) o.onTap(bare); }
  }

  /* 路線マスターの地図と同じドラッグ／ピンチ／ロック方式（実績のある実装をそのまま流用） */
  const pts=new Map(); let last=null,pinch=null,moved=0,downG=null;
  const apply=()=>svg.setAttribute('viewBox',vb.map(v=>v.toFixed(1)).join(' '));
  const rect=()=>svg.getBoundingClientRect();
  const toS=(cx,cy)=>{const r=rect();return{x:vb[0]+(cx-r.left)/r.width*vb[2],y:vb[1]+(cy-r.top)/r.height*vb[3]}};
  const zoomAt=(f,cx,cy)=>{const nw=Math.min(D.frame[2]*1.5,Math.max(6,vb[2]*f)),k=nw/vb[2],p=toS(cx,cy);
    vb[0]=p.x-(p.x-vb[0])*k; vb[1]=p.y-(p.y-vb[1])*k; vb[2]=nw; vb[3]=nw*AR_P; apply()};
  const zc=f=>{const r=rect(); zoomAt(f, r.left+r.width/2, r.top+r.height/2)};
  const clearDrag=()=>{pts.clear();last=null;pinch=null;downG=null;wrap.classList.remove('is-drag')};
  svg.addEventListener('pointerdown',e=>{
    if(locked){ downG=e.target.closest?e.target.closest('[data-tap]'):null;
      if(downG&&o.interactive){handleTap(downG.getAttribute('data-pref'));downG=null} return; }
    pts.set(e.pointerId,e);
    if(pts.size===1){ last={x:e.clientX,y:e.clientY}; moved=0; wrap.classList.add('is-drag');
      downG=e.target.closest?e.target.closest('[data-tap]'):null; }
    if(pts.size===2){ const a=[...pts.values()]; pinch=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY); downG=null; }
  });
  svg.addEventListener('pointermove',e=>{
    if(locked) return;
    if(e.buttons===0 && e.pointerType!=='touch'){ if(pts.size)clearDrag(); return; }
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,e);
    if(pts.size===2 && pinch){ const a=[...pts.values()];
      const d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
      if(d>0){ zoomAt(pinch/d,(a[0].clientX+a[1].clientX)/2,(a[0].clientY+a[1].clientY)/2); pinch=d; moved=99; } return; }
    if(pts.size===1 && last){ const r=rect();
      const dx=(e.clientX-last.x)/r.width*vb[2], dy=(e.clientY-last.y)/r.height*vb[3];
      moved+=Math.abs(dx)+Math.abs(dy); vb[0]-=dx; vb[1]-=dy; apply(); last={x:e.clientX,y:e.clientY}; }
  });
  const fin=()=>{ wrap.classList.remove('is-drag');
    if(moved<9 && downG && o.interactive) handleTap(downG.getAttribute('data-pref'));
    downG=null; last=null; pinch=null; };
  ['pointerup','pointercancel'].forEach(ev=>svg.addEventListener(ev,e=>{
    pts.delete(e.pointerId); if(pts.size===0) fin(); else if(pts.size<2) pinch=null; }));
  const winUp=e=>{ if(!pts.size) return; pts.delete(e.pointerId); if(pts.size===0) clearDrag(); };
  window.addEventListener('pointerup',winUp);
  window.addEventListener('pointercancel',winUp);
  window.addEventListener('blur',()=>{ if(pts.size) clearDrag(); });
  let lastLeave=false;
  svg.addEventListener('pointerleave',()=>{ if(pts.size===1 && last) lastLeave=true; });
  svg.addEventListener('pointerenter',e=>{ if(lastLeave && e.buttons===0) clearDrag(); lastLeave=false; });
  svg.addEventListener('wheel',e=>{ if(locked) return; e.preventDefault(); zoomAt(e.deltaY>0?1.14:0.88,e.clientX,e.clientY); },{passive:false});

  const tl = el('div','map-tools');
  const mb=(s2,fn,l)=>{const b=el('button',null,s2); b.setAttribute('aria-label',l);
    b.onclick=ev=>{ev.stopPropagation();fn()}; return b};
  tl.appendChild(mb('＋',()=>zc(0.76),'拡大'));
  tl.appendChild(mb('－',()=>zc(1.3),'縮小'));
  tl.appendChild(mb('⟲',()=>{vb=D.frame.slice();apply()},'全体表示'));
  wrap.appendChild(tl);
  if(o.locked){
    tl.style.display='none';
    const lk = el('button','maplock','🔒 地図を操作する');
    lk.onclick=ev=>{ ev.stopPropagation();
      locked=!locked;
      lk.className=locked?'maplock':'maplock is-on';
      lk.textContent=locked?'🔒 地図を操作する':'✋ 操作中（押すと固定）';
      tl.style.display=locked?'none':'flex';
      setTouch(); };
    wrap.appendChild(lk);
  }
  return {wrap:wrap, svg:svg};
}

/* ---------- クイズ本体（23区版と同じ形） ---------- */
const PREF_ROUND = 10;
/* 8地方区分（一般的な区分。沖縄は九州地方に含めて「九州・沖縄地方」とする） */
const REGIONS = {
  '北海道地方':['北海道'],
  '東北地方':['青森','岩手','宮城','秋田','山形','福島'],
  '関東地方':['茨城','栃木','群馬','埼玉','千葉','東京','神奈川'],
  '中部地方':['新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知'],
  '近畿地方':['三重','滋賀','京都','大阪','兵庫','奈良','和歌山'],
  '中国地方':['鳥取','島根','岡山','広島','山口'],
  '四国地方':['徳島','香川','愛媛','高知'],
  '九州・沖縄地方':['福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄']
};
const REGION_OF = {};
Object.keys(REGIONS).forEach(r=>REGIONS[r].forEach(p=>REGION_OF[p]=r));
/* 色：地方ごとに色の系統（色相・彩度）を決め、同じ地方の中で隣り合う県は
   明るさを変えて塗り分ける（地方内だけで貪欲彩色）。隣り合う地方どうしは
   似た色相にならないように選び、正解・不正解の緑・赤とも紛れない色相にしている */
const REGION_HUE = {'北海道地方':[300,35],'東北地方':[170,45],'関東地方':[25,75],'中部地方':[215,60],
  '近畿地方':[275,45],'中国地方':[30,30],'四国地方':[50,75],'九州・沖縄地方':[330,55]};
const SHADE_LIGHT = [44, 56, 68, 34];
const PREF_FILL = (()=>{
  const shade = {}, fill = {};
  Object.keys(PGEOM).forEach(full=>{
    const reg = REGION_OF[stripSuffix(full)];
    const used = new Set((PREF_ADJ[full]||[]).filter(m=>REGION_OF[stripSuffix(m)]===reg)
      .map(m=>shade[m]).filter(v=>v!==undefined));
    let s = 0; while(used.has(s)) s++;
    shade[full] = s;
    const hs = REGION_HUE[reg];
    fill[full] = 'hsl('+hs[0]+','+hs[1]+'%,'+SHADE_LIGHT[s % SHADE_LIGHT.length]+'%)';
  });
  return fill;
})();
/* 区分ごとの色の凡例（地図の下に置く）。都道府県・旧国名で共用 */
function regionLegend(names, hue){
  const d = el('div');
  d.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 10px;font-size:12px';
  names.forEach(r=>{
    const hs = hue[r], s = el('span');
    s.style.cssText = 'display:inline-flex;align-items:center;gap:4px;white-space:nowrap';
    s.innerHTML = '<i style="display:inline-block;width:12px;height:12px;border-radius:2px;background:hsl('
      + hs[0]+','+hs[1]+'%,'+SHADE_LIGHT[1]+'%)"></i>' + r;
    d.appendChild(s);
  });
  return d;
}

function genPrefQ(){
  const kind = pick(['where','adj','region']);
  if(kind==='where'){
    const target = pick(PREF_NAMES);
    return {t:'where', target:target, text: target+prefSuffix(target)+'はどこ？　地図から選んでください。'};
  }
  if(kind==='region'){
    const rname = pick(Object.keys(REGIONS));
    const members = REGIONS[rname];
    const answer = pick(members);
    const others = shuffle(PREF_NAMES.filter(w=>members.indexOf(w)<0)).slice(0,3);
    if(others.length<3) return genPrefQ();
    return {t:'region', region:rname, answer:answer,
      options:shuffle([answer].concat(others)),
      text: rname+'に含まれるのは？'};
  }
  const target = pick(PREF_NAMES);
  const adjFull = PREF_ADJ[prefFull(target)] || [];
  const adj = adjFull.map(stripSuffix);
  if(!adj.length) return genPrefQ();
  const answer = pick(adj);
  const notAdj = shuffle(PREF_NAMES.filter(w=>w!==target && adj.indexOf(w)<0)).slice(0,3);
  if(notAdj.length<3) return genPrefQ();
  return {t:'adj', target:target, answer:answer,
    options:shuffle([answer].concat(notAdj)),
    text: target+prefSuffix(target)+'に隣接するのは？'};
}
const prefSuffix = bare => bare==='北海道' ? '' : (PREF_SUFFIX[bare]||'県');

function startPrefSession(){
  state.geoP = {i:0, res:[], q:null, ans:false, revealed:new Set()};
  nextPrefQ();
}
function nextPrefQ(){
  const G = state.geoP;
  if(G.i>=PREF_ROUND){ finishPref(); return; }
  G.q = genPrefQ(); G.ans=false; G.revealed=new Set();
  render('geoPrefQuiz');
}
function finishPref(){
  const G = state.geoP, ok = G.res.filter(Boolean).length;
  render('geoPrefResult', {ok:ok, pct:Math.round(ok/PREF_ROUND*100)});
}
function gradePref(ok, extra){
  const G = state.geoP;
  if(G.ans) return;
  G.ans = true; G.res.push(ok);
  prefFeedback(ok, extra||{});
}
function screenGeoPrefQuiz(){
  const G = state.geoP, q = G.q, w = el('div');
  const pr = el('div','prog'), bs = el('div','prog__b');
  for(let i=0;i<PREF_ROUND;i++) bs.appendChild(el('i', i<G.res.length ? (G.res[i]?'ok':'ng') : (i===G.i?'now':'')));
  pr.appendChild(bs);
  const ab = el('button', null, 'やめる');
  ab.onclick=()=>render('geoNational');
  pr.appendChild(ab);
  w.appendChild(pr);

  const browseMap = buildPrefMap({revealed:G.revealed, interactive:true, mode:'browse'});
  w.appendChild(browseMap.wrap);
  w.appendChild(regionLegend(Object.keys(REGIONS), REGION_HUE));
  w.appendChild(cap('都道府県をタップすると名前が表示されます（次の問題で再び隠れます）／この地図は確認用で、解答には使いません'));

  w.appendChild(el('p','q-text',q.text));

  if(q.t==='where'){
    w.appendChild(el('p','hint','下の地図をタップして解答してください。'));
    const answerMap = buildPrefMap({interactive:true, mode:'answer', onTap:(name)=>{
      if(G.ans) return;
      gradePref(name===q.target, {picked:name});
    }});
    w.appendChild(answerMap.wrap);
  }
  if(q.t==='adj' || q.t==='region'){
    q.options.forEach((o,n)=>{
      const b = el('button','opt');
      b.innerHTML = '<span class="opt__k">'+(n+1)+'</span>'+o+prefSuffix(o);
      b.onclick=()=>{
        if(G.ans) return;
        const l = w.querySelectorAll('.opt');
        for(let i=0;i<l.length;i++){ l[i].disabled=true;
          if(q.options[i]===q.answer) l[i].classList.add('is-r');
          else if(q.options[i]===o) l[i].classList.add('is-w'); }
        gradePref(o===q.answer, {picked:o});
      };
      w.appendChild(b);
    });
  }
  return w;
}
function prefFeedback(ok, ex){
  const G = state.geoP, q = G.q;
  const card = el('div','card');
  card.appendChild(el('div','verdict '+(ok?'ok':'ng'), ok?'正解':'不正解'));
  const body = el('div','explain');
  const marks = []; let arrow = null;
  if(q.t==='where'){
    arrow = q.target;
    marks.push({key:q.target, kind:'right'});
    if(ex.picked && ex.picked!==q.target) marks.push({key:ex.picked, kind:'wrong'});
    body.innerHTML = '<b>'+q.target+prefSuffix(q.target)+'</b>の位置はここです。'
      + (ex.picked && ex.picked!==q.target ? 'タップしたのは <b>'+ex.picked+prefSuffix(ex.picked)+'</b> でした。' : '');
  } else if(q.t==='region'){
    arrow = q.answer;
    marks.push({key:q.answer, kind:'right'});
    const members = REGIONS[q.region].map(b=>b+prefSuffix(b));
    body.innerHTML = '<b>'+q.region+'</b>に含まれるのは '+members.join('、')+' です。'
      + (q.answer!==null? '（正解は <b>'+q.answer+prefSuffix(q.answer)+'</b>）':'');
  } else {
    arrow = q.answer;
    marks.push({key:q.target, kind:'right'}); marks.push({key:q.answer, kind:'right'});
    const adjFull = PREF_ADJ[prefFull(q.target)]||[];
    const adjList = adjFull.map(f=>{const b=stripSuffix(f); return b+prefSuffix(b)});
    body.innerHTML = '<b>'+q.target+prefSuffix(q.target)+'</b>に隣接するのは '
      + (adjList.length? adjList.join('、') : '（海に囲まれており、陸上で隣接する都道府県はありません）') + ' です。';
  }
  card.appendChild(body);
  const mb = el('div'); mb.style.marginTop='14px';
  mb.appendChild(el('div','eyebrow','位置を確認（赤い丸＝答え）'));

const KGEOM = {}; // 国名→[[ [lon,lat], ... ], ...]
for(const k in KUNI_PACKED) KGEOM[k] = KUNI_PACKED[k].map(decPath);
const KUNI_NAMES = Object.keys(KGEOM);
function kuniMain(n){
  const rings = KGEOM[n];
  return rings.reduce((best,r)=>Math.abs(ringArea(r))>Math.abs(ringArea(best))?r:best, rings[0]);
}
/* 初期表示範囲：北緯30度より南の島々（大隅国に属したトカラ・奄美）は、
   データとしては残しつつ、枠の計算からは外す（都道府県版の南方離島と同じ扱い） */
const KFULL = (()=>{
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const k in KGEOM) KGEOM[k].forEach(r=>{
    if(r.every(c=>c[1]<30.0)) return;
    r.forEach(c=>{const x=ppx(c[0]),y=ppy(c[1]);
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;});
  });
  const padX=(x1-x0)*0.05, padY=(y1-y0)*0.05;
  return [x0-padX, y0-padY, (x1-x0)+padX*2, (y1-y0)+padY*2];
})();

   似た色相にならないように選び、正解・不正解の緑・赤とも紛れない色相にしている */
const GOKI_HUE = {'畿内':[275,45],'東海道':[25,75],'東山道':[170,45],'北陸道':[215,60],
  '山陰道':[30,30],'山陽道':[195,65],'南海道':[50,75],'西海道':[330,55]};
const KUNI_LIGHT = SHADE_LIGHT;
const KFILL = (()=>{
  const shade = {}, fill = {};
  KUNI_NAMES.forEach(n=>{
    const used = new Set((KUNI_ADJ[n]||[]).filter(m=>GOKI_OF[m]===GOKI_OF[n])
      .map(m=>shade[m]).filter(v=>v!==undefined));
    let s = 0; while(used.has(s)) s++;
    shade[n] = s;
    const hs = GOKI_HUE[GOKI_OF[n]];
    fill[n] = 'hsl('+hs[0]+','+hs[1]+'%,'+KUNI_LIGHT[s % KUNI_LIGHT.length]+'%)';
  });
  return fill;
})();
/* ラベル配置：小さい国から順に、文字の60%が国内に収まり、かつ
   先に置いたラベルと重ならない最大サイズを探す（最低5px相当は保証）。
   大きい国だけ文字が極端に大きくならないよう、上限を9px相当にする */
const KSCALE = KFULL[2] / 380;
const KUNI_MAX_LABEL_PX = 9;
const KLABEL = (()=>{
  const plan = {}, placed = [];
  const byArea = KUNI_NAMES.slice().sort((a,b)=>Math.abs(ringArea(kuniMain(a)))-Math.abs(ringArea(kuniMain(b))));
  byArea.forEach(n=>{
    const r = kuniMain(n), rp = r.map(pt=>[ppx(pt[0]),ppy(pt[1])]);
    const c = safeCentroid(r), cx = ppx(c[0]), cy = ppy(c[1]);
    const rb = bboxOf(rp), minU = MIN_LABEL_PX*KSCALE, maxU = KUNI_MAX_LABEL_PX*KSCALE;
    let lo = minU, hi = Math.max(lo*1.01, Math.min(rb.w*0.45, rb.h*0.45, maxU)), best = minU;
    for(let it=0; it<22; it++){
      const mid=(lo+hi)/2, tb=textBoxUnits(n, mid);
      const box={x0:cx-tb.w/2,x1:cx+tb.w/2,y0:cy-tb.h/2,y1:cy+tb.h/2};
      if(containFrac(rp,cx,cy,tb.w,tb.h)>=0.6 && !placed.some(pb=>boxesOverlap(pb,box))){ best=mid; lo=mid; } else { hi=mid; }
    }
    const tb = textBoxUnits(n, best);
    plan[n] = {cx, cy, size:best};
    placed.push({x0:cx-tb.w/2,x1:cx+tb.w/2,y0:cy-tb.h/2,y1:cy+tb.h/2});
  });
  return plan;
})();
const KUNI_MAPDATA = {geom:KGEOM, key:n=>n, full:n=>n, label:KLABEL, frame:KFULL,
  fill:n=>KFILL[n], main:kuniMain};
/* 五畿七道の色の凡例（地図の下に置く） */
const kuniLegend = () => regionLegend(Object.keys(GOKI), GOKI_HUE);
const KUNI_CREDIT = '旧国境界：人間文化研究機構「幕末明治地勢地図境界データ」（CC BY-NC）を加工して作成';
const kuniRuby = n => n+'（'+KUNI_YOMI[n]+'）';

/* ---------- 旧国名クイズ本体（47都道府県クイズと同じ形） ---------- */
const KUNI_ROUND = 10;
function genKuniQ(){
  const kind = pick(['where','adj','region']);
  if(kind==='where'){
    const target = pick(KUNI_NAMES);
    return {t:'where', target:target, text: target+'国（'+KUNI_YOMI[target]+'）はどこ？　地図から選んでください。'};
  }
  if(kind==='region'){
    const rname = pick(Object.keys(GOKI));
    const members = GOKI[rname];
    const answer = pick(members);
    const others = shuffle(KUNI_NAMES.filter(w=>members.indexOf(w)<0)).slice(0,3);
    return {t:'region', region:rname, answer:answer,
      options:shuffle([answer].concat(others)),
      text: rname+'に含まれる国は？'};
  }
  const target = pick(KUNI_NAMES);
  const adj = KUNI_ADJ[target] || [];
  if(!adj.length) return genKuniQ();
  const answer = pick(adj);
  const notAdj = shuffle(KUNI_NAMES.filter(w=>w!==target && adj.indexOf(w)<0)).slice(0,3);
  return {t:'adj', target:target, answer:answer,
    options:shuffle([answer].concat(notAdj)),
    text: target+'国に隣接する国は？'};
}
function startKuniSession(){
  state.geoK = {i:0, res:[], q:null, ans:false, revealed:new Set()};
  nextKuniQ();
}
function nextKuniQ(){
  const G = state.geoK;
  if(G.i>=KUNI_ROUND){ finishKuni(); return; }
  G.q = genKuniQ(); G.ans=false; G.revealed=new Set();
  render('geoKuniQuiz');
}
function finishKuni(){
  const G = state.geoK, ok = G.res.filter(Boolean).length;
  render('geoKuniResult', {ok:ok, pct:Math.round(ok/KUNI_ROUND*100)});
}
function gradeKuni(ok, extra){
  const G = state.geoK;
  if(G.ans) return;
  G.ans = true; G.res.push(ok);
  kuniFeedback(ok, extra||{});
}
function screenGeoKuniQuiz(){
  const G = state.geoK, q = G.q, w = el('div');
  const pr = el('div','prog'), bs = el('div','prog__b');
  for(let i=0;i<KUNI_ROUND;i++) bs.appendChild(el('i', i<G.res.length ? (G.res[i]?'ok':'ng') : (i===G.i?'now':'')));
  pr.appendChild(bs);
  const ab = el('button', null, 'やめる');
  ab.onclick=()=>render('geoNational');
  pr.appendChild(ab);
  w.appendChild(pr);

  const browseMap = buildPrefMap({data:KUNI_MAPDATA, revealed:G.revealed, interactive:true, mode:'browse'});
  w.appendChild(browseMap.wrap);
  w.appendChild(kuniLegend());
  w.appendChild(cap('国をタップすると名前が表示されます（次の問題で再び隠れます）／この地図は確認用で、解答には使いません'));

  w.appendChild(el('p','q-text',q.text));

  if(q.t==='where'){
    w.appendChild(el('p','hint','下の地図をタップして解答してください。'));
    const answerMap = buildPrefMap({data:KUNI_MAPDATA, interactive:true, mode:'answer', onTap:(name)=>{
      if(G.ans) return;
      gradeKuni(name===q.target, {picked:name});
    }});
    w.appendChild(answerMap.wrap);
  }
  if(q.t==='adj' || q.t==='region'){
    q.options.forEach((o,n)=>{
      const b = el('button','opt');
      b.innerHTML = '<span class="opt__k">'+(n+1)+'</span>'+kuniRuby(o);
      b.onclick=()=>{
        if(G.ans) return;
        const l = w.querySelectorAll('.opt');
        for(let i=0;i<l.length;i++){ l[i].disabled=true;
          if(q.options[i]===q.answer) l[i].classList.add('is-r');
          else if(q.options[i]===o) l[i].classList.add('is-w'); }
        gradeKuni(o===q.answer, {picked:o});
      };
      w.appendChild(b);
    });
  }
  w.appendChild(cap(KUNI_CREDIT));
  return w;
}
function kuniFeedback(ok, ex){
  const G = state.geoK, q = G.q;
  const card = el('div','card');
  card.appendChild(el('div','verdict '+(ok?'ok':'ng'), ok?'正解':'不正解'));
  const body = el('div','explain');
  const marks = []; let arrow = null;
  if(q.t==='where'){
    arrow = q.target;
    marks.push({key:q.target, kind:'right'});
    if(ex.picked && ex.picked!==q.target) marks.push({key:ex.picked, kind:'wrong'});
    body.innerHTML = '<b>'+kuniRuby(q.target)+'</b>の位置はここです。'
      + (ex.picked && ex.picked!==q.target ? 'タップしたのは <b>'+kuniRuby(ex.picked)+'</b> でした。' : '');
  } else if(q.t==='region'){
    arrow = q.answer;
    marks.push({key:q.answer, kind:'right'});
    body.innerHTML = '<b>'+q.region+'</b>に含まれるのは '+GOKI[q.region].join('、')+' です。'
      + '（正解は <b>'+kuniRuby(q.answer)+'</b>）';
  } else {
    arrow = q.answer;
    marks.push({key:q.target, kind:'right'}); marks.push({key:q.answer, kind:'right'});
    body.innerHTML = '<b>'+kuniRuby(q.target)+'</b>に隣接するのは '+(KUNI_ADJ[q.target]||[]).join('、')+' です。'
      + '（海峡をはさむ国も含みます）';
  }
  card.appendChild(body);
  const mb = el('div'); mb.style.marginTop='14px';
  mb.appendChild(el('div','eyebrow','位置を確認（赤い丸＝答え）'));
  mb.appendChild(buildPrefMap({data:KUNI_MAPDATA, mode:'reveal', interactive:false, marks:marks, arrow:arrow}).wrap);
  mb.appendChild(kuniLegend());
  card.appendChild(mb);
  const btn = el('button','btn', G.i+1>=KUNI_ROUND ? '結果を見る' : '次の問題へ');
  btn.onclick=()=>{ G.i++; nextKuniQ(); };
  card.appendChild(btn);
  $('#screen').appendChild(card);
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function screenGeoKuniResult(d){
  const w = el('div'), c = el('div','card');
  c.appendChild(el('div','eyebrow','全国地理マスター — 旧国名クイズ'));
  c.innerHTML += '<div class="score">'+d.ok+'<small> / '+KUNI_ROUND+'　正答率 '+d.pct+'%</small></div>';
  w.appendChild(c);
  const b1 = el('button','btn','もう一度');
  b1.onclick = startKuniSession;
  w.appendChild(b1);
  const b2 = el('button','btn btn--gh','戻る');
  b2.style.marginTop='10px';
  b2.onclick = ()=>render('geoNational');
  w.appendChild(b2);
  w.appendChild(cap(KUNI_CREDIT));
  return w;
}

  const w = el('div');

  w.appendChild(hero);

    + '<em>「○○県はどこ？」「隣接する県は？」を地図で答える。</em></span><span class="pick__a">›</span>';
  b1.onclick = startPrefSession;
  w.appendChild(b1);

    + '<em>山城・武蔵など73の国（令制国）の場所・隣の国・五畿七道を答える。</em></span><span class="pick__a">›</span>';
  b2.onclick = startKuniSession;

  w.appendChild(hero);

  b2.onclick=()=>render('geoTokyo');
  w.appendChild(b2);
  const b3=el('button','pick');
  b3.innerHTML='<span class="pick__i">🗾</span><span class="pick__b"><b>全国地理マスター</b>'
    +'<em>47都道府県と旧国名の場所を、地図クイズで覚える。</em></span><span class="pick__a">›</span>';
  b3.onclick=()=>render('geoNational');

/* 東京路線マスターに入る（既存の自動ログイン判定はここで行う） */
async function enterRailMaster(){
  let last='';
  try{const r=await STORE.get(SKEY);last=r&&r.value?r.value:''}catch(e){}
  if(last){const a=await getAccounts();
    if(a[last]){state.user=last;state.isAdmin=isAdminCred(last,a[last].pw);
      state.admin=false;applyAccount(a[last]);render('home');return}}
  render('login');
}
document.getElementById('signRow').addEventListener('click',async()=>{
  if(!await leaveOk())return;
  stopTimer();state.session=null;state.check=null;state.review=null;

  render('gameselect');
